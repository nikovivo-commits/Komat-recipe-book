    try { const raw = localStorage.getItem(DB_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  };
  LocalDB.prototype.save = function () {
    try { localStorage.setItem(DB_KEY, JSON.stringify(this.docs)); this.full = false; }
    catch (e) { if (!this.full) { this.full = true; K.toast('This device is out of storage space. Export a backup in Settings, then clear old photos.', { tone: 'bad' }); } }
  };
  LocalDB.prototype.write = function (path, data) {
    if (data === undefined) delete this.docs[path]; else this.docs[path] = K.clone(data);
    this.save();
    const coll = parentOf(path);
    this.subs.forEach((s) => { if (s.path === path || s.coll === coll) this.deliver(s); });
    return Promise.resolve();
  };
  LocalDB.prototype.deliver = function (s) {
    setTimeout(() => {
      if (!this.subs.has(s)) return;
      if (s.path) s.next(snap(s.path, this.docs[s.path]));
      else s.next(this.run(s.q));
    }, 0);
  };
  LocalDB.prototype.run = function (q) {
    let docs = Object.keys(this.docs).filter((p) => parentOf(p) === q.coll).map((p) => ({ p: p, d: this.docs[p] }));
    docs = docs.filter((x) => q.where.every((w) => test(x.d, w)));
    if (q.order) {
      const f = q.order[0], dir = q.order[1] === 'desc' ? -1 : 1;
      docs.sort((a, b) => (a.d[f] === b.d[f] ? 0 : a.d[f] === undefined ? 1 : b.d[f] === undefined ? -1 : a.d[f] < b.d[f] ? -dir : dir));
    } else docs.sort((a, b) => (a.p < b.p ? -1 : 1));
    if (q.limit) docs = docs.slice(0, q.limit);
    const list = docs.map((x) => snap(x.p, x.d));
    return { docs: list, size: list.length, empty: !list.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  };
  LocalDB.prototype.doc = function (path) {
    const db = this;
    const ref = {
      id: path.slice(path.lastIndexOf('/') + 1), path: path,
      get: () => Promise.resolve(snap(path, db.docs[path])),
      set: (d) => db.write(path, d),
      update: (d) => (db.docs[path] ? db.write(path, merge(K.clone(db.docs[path]), d)) : Promise.reject(err('invalid_argument', 'Document does not exist'))),
      delete: () => db.write(path, undefined),
      onSnapshot: (next) => { const s = { path: path, next: next }; db.subs.add(s); db.deliver(s); return () => db.subs.delete(s); },
      collection: (sub) => db.collection(path + '/' + sub),
    };
    return ref;
  };
  LocalDB.prototype.collection = function (coll) {
    const db = this;
    function query(q) {
      return {
        where: (f, op, v) => query(Object.assign({}, q, { where: q.where.concat([[f, op, v]]) })),
        orderBy: (f, dir) => query(Object.assign({}, q, { order: [f, dir] })),
        limit: (n) => query(Object.assign({}, q, { limit: n })),
        get: () => Promise.resolve(db.run(q)),
        onSnapshot: (next) => { const s = { coll: coll, q: q, next: next }; db.subs.add(s); db.deliver(s); return () => db.subs.delete(s); },
      };
    }
    return Object.assign(query({ coll: coll, where: [] }), {
      path: coll,
      doc: (id) => db.doc(coll + '/' + (id || K.uid())),
      add: (d) => { const ref = db.doc(coll + '/' + K.uid()); return ref.set(d).then(() => ref); },
    });
  };
  LocalDB.prototype.exportAll = function () { return K.clone(this.docs); };
  LocalDB.prototype.importAll = function (docs) {

  /* ---------- local photo store (IndexedDB) ---------- */
  const LocalAssets = {
    urls: {},
    idb: null,
    open() {
      if (this.idb) return Promise.resolve(this.idb);
      return new Promise((res, rej) => {
        let r;
        try { r = indexedDB.open('komat-assets', 1); } catch (e) { rej(err('not_granted')); return; }
        r.onupgradeneeded = () => r.result.createObjectStore('blobs');
        r.onsuccess = () => { this.idb = r.result; res(this.idb); };
        r.onerror = () => rej(err('not_granted'));
      });
    },
    init() {
      return this.open().then((idb) => new Promise((res) => {
        const tx = idb.transaction('blobs', 'readonly'), st = tx.objectStore('blobs'), req = st.openCursor();
        req.onsuccess = () => {
          const c = req.result;

        };
        req.onerror = () => res();
      })).catch(() => {});
    },
    upload(blob) {
      if (blob.size > 20 * 1024 * 1024) return Promise.reject(err('too_large'));
      const id = 'local-' + K.uid();

        const tx = idb.transaction('blobs', 'readwrite');

        tx.onerror = () => rej(err('quota_or_state'));

    },
    delete(id) {
      if (!String(id).startsWith('local-')) return Promise.resolve({ deleted: false });
      return this.open().then((idb) => new Promise((res) => {
        const tx = idb.transaction('blobs', 'readwrite');

        tx.onerror = () => res({ deleted: false });
      }));
    },
  };
  K.LocalAssets = LocalAssets;

  /* where a stored photo or video id can be shown from */
  K.media = function (id) {
    if (!id) return '';
    if (/[/:]/.test(id)) return id;
    if (K.mode === 'cloud') return '/_blob/' + id;
    if (K.mode === 'firebase') return K.Fire.assets.url(id);
    return LocalAssets.urls[id] || 'assets/photos/' + id + '.jpg';
  };

  /* friendly text for upload failures */
  K.uploadErr = function (e) {
    const c = e && e.code;
    if (c === 'too_large') return 'That file is over 20 MB. Trim the video or record at 720p, then try again.';
    if (c === 'unsupported_type') return 'That file type is not supported. Use JPG or PNG photos and MP4 or WebM video.';
    if (c === 'quota_or_state') return 'Photo storage is full. Delete some old videos, then try again.';
    if (c === 'rate_limited') return 'Too many uploads at once. Wait a moment and try again.';
    if (c === 'not_granted') return 'Uploading is not available here.';
    return 'Upload failed. Check your connection and try again.';
  };
})();

    /* one card per product: spellings and forms of the same thing order as one */
    'слънчогледово олио': 'олио', 'рапица олио': 'олио рапица', 'оцет ябълков': 'ябълков оцет', 'кимион семена': 'кимион', 'кориандър семена': 'кориандър',

  const ORD_SKIP = /^(сол|вода|(студена|ледена|хладка|топла|гореща|вряла|филтрирана) вода|лед|пипер|черен пипер|бял пипер|зелен пипер|пипер зърна|черен пипер зърна|зърна черен пипер|бял пипер зърна|зелен пипер зърна|сол и пипер|salt|pepper|water|salt and pepper|ice|fine salt|salt, pepper|олио кервиз|олио левурда|зелено олио|wild garlic oil|лещен сос|крокмач)$/;

    return out;
  };
  /* a row's mark for a day (today by default); a DO (or urgent) left open on one of the 3 days before carries over */
  K.mark = function (st, id, date) {
    const base = date || K.day(0), t = D.checks[K.checkId(st, base)], m = t && t.marks && t.marks[id];
    if (m && 'd' in m) return Object.assign({}, m, { d: m.d === 'urg' ? 'do' : m.d });
    for (let k = 1; k <= 3; k++) {
      const p = D.checks[K.checkId(st, dayBefore(base, k))], pm = p && p.marks && p.marks[id];
      if (pm && 'd' in pm) {
        if (pm.d === 'do' || pm.d === 'urg') return Object.assign({}, pm, m || {}, { d: 'do', from: dayBefore(base, k) });
        return m || null;
      }
    }
    return m || null;
  };
  K.markState = (st, id, date) => { const m = K.mark(st, id, date); return (m && m.d) || ''; };
  K.isUrgent = (st, id, date) => { const m = K.mark(st, id, date); return !!(m && (m.u || m.d === 'urg') && m.d !== 'ok'); };
  K.markNote = (st, id, date) => { const m = K.mark(st, id, date); return (m && m.c) || ''; };

  /* patch one row's mark: {d:'do'|'ok'|''} or {u:bool} or {c:'comment'} */
  K.setMark = function (st, it, patch, date) {
    const day = date || K.day(0), id = K.checkId(st, day);
    let doc = D.checks[id];
    const fresh = !doc;
    if (!doc) doc = D.checks[id] = { date: day, station: st, marks: {}, extra: {} };
    doc.marks = doc.marks || {};
    const prev = doc.marks[it.id] ? K.clone(doc.marks[it.id]) : undefined;
    const em = K.mark(st, it.id, day) || {};
    const m = Object.assign({}, prev || {}, patch, { n: it.name });
    if (em.from) { if (m.c === undefined && em.c) m.c = em.c; if (m.d === undefined) m.d = em.d; if (m.u === undefined && em.u) m.u = em.u; }
    if ('d' in patch && (patch.d === 'ok' || patch.d === '')) m.u = false;
    if (!('c' in patch) || Object.keys(patch).length > 1) { m.t = Date.now(); m.by = K.me.id || ''; }
    doc.marks[it.id] = m;
    K.refresh(true);
    const ref = K.db.doc('checks/' + id), body = { marks: {}, at: Date.now() };
    body.marks[it.id] = m;
    const full = () => ref.set({ date: day, station: st, marks: doc.marks, extra: doc.extra || {}, at: Date.now() });
    const p = fresh ? full() : ref.update(body).catch((e) => (e && e.code === 'invalid_argument' ? full() : Promise.reject(e)));
    return p.catch((e) => { if (prev === undefined) delete doc.marks[it.id]; else doc.marks[it.id] = prev; K.refresh(true); writeFailed(e); });
  };
  K.addExtra = function (st, gkey, name, date) {
    const day = date || K.day(0), id = K.checkId(st, day);
    const doc = D.checks[id] || (D.checks[id] = { date: day, station: st, marks: {}, extra: {} });
    doc.extra = doc.extra || {};
    const list = (doc.extra[gkey] || []).concat([{ id: 'x' + K.uid(), name: name }]);
    return saveExtra(st, gkey, list, day);
  };
  K.removeExtra = function (st, gkey, itemId, date) {
    const doc = D.checks[K.checkId(st, date)];
    if (!doc || !doc.extra) return;
    return saveExtra(st, gkey, (doc.extra[gkey] || []).filter((x) => x.id !== itemId), date || K.day(0));
  };
  function saveExtra(st, gkey, list, day) {
    const id = K.checkId(st, day), doc = D.checks[id], old = (doc.extra[gkey] || []).slice();
    doc.extra[gkey] = list;
    K.refresh(true);
    const ref = K.db.doc('checks/' + id), patch = { extra: {}, at: Date.now() };
    patch.extra[gkey] = list;
    const full = () => ref.set({ date: day, station: st, marks: doc.marks || {}, extra: doc.extra, at: Date.now() });
    return ref.update(patch).catch((e) => (e && e.code === 'invalid_argument' ? full() : Promise.reject(e)))
      .catch((e) => { doc.extra[gkey] = old; K.refresh(true); writeFailed(e); });
  }
  K.closedInfo = (st) => { const d = D.checks[K.checkId(st)]; return d && d.closed && d.closed.at ? d.closed : null; };
  K.setClosed = function (st) {
    const id = K.checkId(st), doc = D.checks[id] || (D.checks[id] = { date: K.day(0), station: st, marks: {}, extra: {} });
    const c = { at: Date.now(), by: K.me.id || '' };
    doc.closed = c;
    const ref = K.db.doc('checks/' + id);
    return ref.update({ closed: c, at: Date.now() }).catch((e) => (e && e.code === 'invalid_argument'
      ? ref.set({ date: K.day(0), station: st, marks: doc.marks || {}, extra: doc.extra || {}, closed: c, at: Date.now() }) : Promise.reject(e)));
  };
  K.saveChecklists = function (n, msg) {
    D.checklists = n;
    K.refresh(true);
    return K.db.doc('settings/checklists').set(n).then(() => { if (msg) K.toast(msg); }, writeFailed);
  };

  /* ---------- prep tasks (free tasks, tasks left for tomorrow, event tasks, repeats) ---------- */
  K.prepId = (key, date) => (date || K.day(0)) + '_day_' + K.safeId(key);
  /* status: 'need' | 'done' | '' (removed). it = {key, name, note?, origId?} */
  K.setPrep = function (st, it, status, urgent) {
    const id = K.prepId(it.key), old = D.prep[id];
    let u = urgent === undefined ? !!(old && old.urgent) : !!urgent;
    if (status !== 'need') u = false;
    const body = { date: K.day(0), station: st, service: 'day', key: it.key, name: it.name, status: status, at: Date.now(), by: K.me.id || '', task: true, urgent: u };
    if (old && old.leftBy) { body.leftBy = old.leftBy; body.leftAt = old.leftAt || 0; }
    const nt = it.note !== undefined ? it.note : (old && old.note) || '';
    if (nt) body.note = nt;
    if (u) body.urgentAt = (old && old.urgent && old.urgentAt) || Date.now();
    const orig = it.origId && it.origId !== id ? it.origId : null, od = orig ? D.prep[orig] : null;
    if (orig && od) {
      if (od.leftBy && !body.leftBy) { body.leftBy = od.leftBy; body.leftAt = od.leftAt || 0; }
      if (od.note && !body.note) body.note = od.note;
      delete D.prep[orig];
    }
    if (status === '') delete D.prep[id]; else D.prep[id] = body;
    K.refresh(true);
    const ref = K.db.doc('prep/' + id);
    return (status === '' ? ref.delete() : ref.set(body))
      .then(() => { if (orig) return K.db.doc('prep/' + orig).delete().catch(() => {}); })
      .catch((e) => { if (old) D.prep[id] = old; else delete D.prep[id]; if (orig && od) D.prep[orig] = od; K.refresh(true); writeFailed(e); });
  };
  K.setPrepNote = function (id, text) {
    const d = D.prep[id];
    if (!d) return;
    const b = K.clone(d);
    if (text) b.note = text; else delete b.note;
    D.prep[id] = b;
    K.refresh(true);
    return K.db.doc('prep/' + id).set(b).catch((e) => { D.prep[id] = d; K.refresh(true); writeFailed(e); });
  };
  K.removePrep = function (id) {
    const old = D.prep[id];
    delete D.prep[id];
    K.refresh(true);
    return K.db.doc('prep/' + id).delete().catch((e) => { D.prep[id] = old; K.refresh(true); writeFailed(e); });
  };
  K.restorePrep = function (id, body) {
    D.prep[id] = body;
    K.refresh(true);
    return K.db.doc('prep/' + id).set(body).catch(writeFailed);
  };
  /* today's tasks for a station; unfinished free tasks from the last 3 days carry over */
  K.dayTasks = function (st) {
    const out = [], pre = K.day(0) + '_day_', have = {};
    Object.keys(D.prep).forEach((id) => {
      const d = D.prep[id];
      if (id.startsWith(pre) && d.station === st && d.status) { out.push(Object.assign({ _id: id }, d)); have[d.key] = 1; }
    });
    Object.keys(D.prep).forEach((id) => {
      const d = D.prep[id];
      if (d.station !== st || d.status !== 'need' || !d.task || have[d.key] || String(d.key).startsWith('evt-') || String(d.key).startsWith('auto-')) return;
      if (!(d.date < K.day(0))) return;
      have[d.key] = 1;
      out.push(Object.assign({}, d, { _id: id, _orig: id, _from: d.date }));
    });
    return out.sort((a, b) => (a.at || 0) - (b.at || 0));
  };
  K.leaveForTomorrow = function (st, name, urgent, note) {
    const date = K.day(1), key = 'task-' + K.uid(), id = K.prepId(key, date);
    const body = { date: date, station: st, service: 'day', key: key, name: name, status: 'need', at: Date.now(), by: K.me.id || '', task: true, urgent: !!urgent, leftBy: K.me.id || '', leftAt: Date.now() };
    if (urgent) body.urgentAt = Date.now();
    if (note) body.note = note;
    D.prep[id] = body;
    K.refresh(true);
    return K.db.doc('prep/' + id).set(body).then(() => K.toast('Left for tomorrow on ' + K.ST[st]), (e) => { delete D.prep[id]; K.refresh(true); writeFailed(e); });
  };
  K.tomorrowTasks = function (st) {
    const pre = K.day(1) + '_day_', out = [];
    Object.keys(D.prep).forEach((id) => { const d = D.prep[id]; if (id.startsWith(pre) && d.station === st && d.status === 'need') out.push({ id: id, d: d }); });
    return out.sort((a, b) => (b.d.urgent ? 1 : 0) - (a.d.urgent ? 1 : 0) || (a.d.at || 0) - (b.d.at || 0));
  };
  K.repeatsToday = function (st) {
    const wd = K.kitchenNow().getDay();
    return (K.kitchen().repeats || []).filter((rp) => rp.station === st && (rp.days || []).includes(wd)).map((rp) => {
      const key = 'auto-' + rp.id, d = D.prep[K.prepId(key)];
      return { key: key, name: rp.name, days: rp.days, done: !!(d && d.status === 'done') };
    });
  };
  /* every urgent thing in the kitchen today, oldest first */
  K.openUrgents = function () {
    const out = [], pre = K.day(0) + '_';
    Object.keys(D.prep).forEach((id) => { const d = D.prep[id]; if (id.startsWith(pre) && d.urgent && d.status === 'need') out.push(Object.assign({ _id: id }, d)); });
    K.STATIONS.forEach((s) => K.checkItems(s[0]).forEach((it) => {
      if (!K.isUrgent(s[0], it.id)) return;
      const m = K.mark(s[0], it.id) || {};
      out.push({ check: true, it: it, station: s[0], name: it.name, note: m.c || '', at: m.t || 0, by: m.by || '' });
    }));
    return out.sort((a, b) => (a.urgentAt || a.at || 0) - (b.urgentAt || b.at || 0));
  };

  /* ---------- orders and whiteboard ---------- */
  K.orderFor = (st, date) => D.orders[(date || K.day(0)) + '_' + st] || null;
  K.sendOrder = function (st, items, closing) {
    const id = K.day(0) + '_' + st, ref = K.db.doc('orders/' + id), had = !!D.orders[id];
    let p = items.length ? ref.set({ date: K.day(0), station: st, items: items, at: Date.now(), by: K.me.id || '' }) : had ? ref.delete() : Promise.resolve();
    if (closing) p = p.then(() => K.setClosed(st));
    return p;
  };
  K.saveBoard = function (dataUrl) {
    const d = K.day(0);
    return K.db.doc('boards/' + d).set({ date: d, photo: dataUrl, at: Date.now(), by: K.me.id || '' });
  };

  /* ---------- rota ---------- */
  K.personName = (id) => { const p = D.staff.people.find((x) => x.id === id); return p ? p.name : '?'; };
  K.codeClass = (c) => {
    c = String(c || '').trim().toUpperCase();
    if (!c) return 'blank';
    if (c === '0' || c === 'X') return 'off';
    if (c.startsWith('BR')) return 'br';
    if (c === 'P') return 'p';
    return 'other';
  };
  K.codeLabel = (c) => { const u = String(c || '').trim().toUpperCase(); const m = D.codes.codes.find((x) => String(x.code).toUpperCase() === u); return m && m.label ? m.label : ''; };
  K.onToday = function () {
    const w = D.weeks[K.thisWeek()], i = K.todayIdx();
    if (!w) return [];
    return (w.people || []).map((id) => ({ id: id, code: ((w.rows || {})[id] || [])[i] || '' }))
      .filter((x) => { const c = String(x.code).trim().toUpperCase(); return c && c !== '0' && c !== 'X'; });
  };
  K.saveWeek = function (wk, body) {
    D.weeks[wk] = body;
    K.refresh(true);
    return K.db.doc('schedules/' + wk).set(body).catch(writeFailed);
  };
  K.saveStaff = (n) => { D.staff = n; K.refresh(true); return K.db.doc('settings/staff').set(n).catch(writeFailed); };
  K.saveCodes = (n) => { D.codes = n; K.refresh(true); return K.db.doc('settings/shiftcodes').set(n).catch(writeFailed); };

  /* ---------- events ---------- */
  K.WHEN = [[0, 'On the day'], [1, '1 day before'], [2, '2 days before'], [3, '3 days before'], [5, '5 days before'], [7, '1 week before']];
  K.isLive = (e) => e.status !== 'cancelled';
  K.upcomingEvents = () => { const t = K.day(0); return D.events.filter((e) => e.date >= t).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))); };
  K.eventsOn = (ds) => D.events.filter((e) => e.date === ds);
  K.evDishes = (e) => (Array.isArray(e.dishes) ? e.dishes : []);
  K.evTasks = (e) => (Array.isArray(e.tasks) ? e.tasks : []);
  K.dueDate = (e, t) => K.ymd(K.addDays(K.parseYmd(e.date), -(+t.before || 0)));
  K.countdown = (e) => { const d = K.daysUntil(e.date); return d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : d > 1 ? 'In ' + d + ' days' : K.prettyDate(e.date, { day: 'numeric', month: 'short' }); };
  K.evTaskStatus = (key) => { const d = D.prep[K.prepId(key)]; return d ? d.status : 'need'; };
  /* event tasks that fall due today (or are overdue) for a station */
  K.eventTasksToday = function (st) {
    const out = [], t = K.day(0);
    D.events.forEach((e) => {
      if (e.status === 'cancelled' || e.status === 'pending') return;
      K.evTasks(e).forEach((k) => {
        const due = K.dueDate(e, k);
        if (k.station === st && due <= t && e.date >= t) out.push({ key: 'evt-' + e.id + '-' + k.id, name: k.text, event: e, late: due < t });
      });
    });
    return out;
  };
  /* portions asked for / the recipe's yield in portions = the factor to open the recipe at */
  K.scaleFor = function (d) {
    const lk = K.linkTarget(d.link);
    if (!lk) return null;
    const n = parseFloat(d.qty);
    if (!(n > 0)) return null;
    const part = lk.ci >= 0 ? lk.r.components[lk.ci] : lk.r, y = parseFloat(part.yieldQty), u = String(part.yieldUnit || '').toLowerCase();
    return y > 0 && /portion|pcs|порц|бр/.test(u) ? n / y : null;
  };
  K.saveEvent = function (id, body) {
    const i = D.events.findIndex((x) => x.id === id), next = Object.assign({ id: id }, body);
    if (i >= 0) D.events[i] = next; else D.events.push(next);
    K.refresh(true);
    return K.db.doc('events/' + id).set(body).then(() => K.toast('Event saved'), writeFailed);
  };
  K.deleteEvent = function (id) {
    D.events = D.events.filter((x) => x.id !== id);
    K.refresh(true);
    return K.db.doc('events/' + id).delete().then(() => K.toast('Event deleted'), writeFailed);
  };

  /* ---------- settings ---------- */
  K.saveBranding = function (patch) {
    const next = Object.assign({ logo: D.branding.logo || '', heroes: (D.branding.heroes || []).slice(), approve: D.branding.approve || '', pages: Object.assign({}, D.branding.pages || {}) }, patch);
    D.branding = next;
    K.refresh(true);
    return K.db.doc('settings/branding').set(next).catch(writeFailed);
  };
  K.saveKitchen = function (patch) {
    const next = Object.assign({}, K.kitchen(), patch);
    D.kitchen = next;
    K.refresh(true);
    return K.db.doc('settings/kitchen').set(next).catch(writeFailed);
  };

  /* ---------- write errors ---------- */
  function writeFailed(e) {
    if (e && e.code === 'invalid_argument') { D.noWrite = true; K.refresh(true); K.toast('Not saved: you can only view this book.', { tone: 'bad' }); }
    else if (e && e.code === 'quota_exceeded') K.toast('The database is full. Ask the head chef to clear old records in Settings.', { tone: 'bad' });
    else K.toast('Not saved. Check your connection and try again.', { tone: 'bad' });
  }
  K.writeFailed = writeFailed;

  /* ---------- names of the people behind ids ---------- */
  let nameQ = {}, nameT = null;
  K.nameOf = function (id) {
    if (!id) return '';
    if (!(id in D.names)) { nameQ[id] = 1; clearTimeout(nameT); nameT = setTimeout(resolveNames, 50); }
    return D.names[id] || '';
  };
  function resolveNames() {
    const ids = Object.keys(nameQ);
    nameQ = {};
    if (!ids.length) return;
    ids.forEach((id) => { D.names[id] = ''; });
    if (!K.user || typeof K.user.profiles !== 'function') return;
    Promise.resolve(K.user.profiles(ids)).then((ps) => {
      let changed = false;
      ids.forEach((id) => { const n = (ps && ps[id] && ps[id].name) || ''; if (n !== D.names[id]) { D.names[id] = n; changed = true; } });
      if (changed) K.refresh();
    }).catch(() => {});
  }

  /* ---------- live subscriptions ---------- */
  let unsubs = [], subDay = '';
  function dateSubs() {
    unsubs.forEach((u) => u());
    unsubs = [];
    subDay = K.day(0);
    const days = (list) => list.map((n) => K.day(n));
    const coll = (name, list, into) => unsubs.push(K.db.collection(name).where('date', 'in', days(list)).onSnapshot((s) => {
      const m = {};
      s.docs.forEach((x) => { m[x.id] = K.clone(x.data()); });
      D[into] = m;
      K.refresh();
    }, onErr));
    coll('checks', [1, 0, -1, -2, -3], 'checks');
    coll('prep', [0, 1, -1, -2, -3], 'prep');
    coll('orders', [0, -1], 'orders');
    coll('boards', [0, -1], 'boards');
  }
  function onErr(e) { if (e && e.code === 'revoked') { D.revoked = true; K.refresh(); } }
  K.subscribe = function () {
    const db = K.db;
    db.collection('recipes').onSnapshot((s) => {
      const list = [];
      /* snapshot data is frozen: copy it before adding the id */
      s.docs.forEach((x) => { try { list.push(K.norm(Object.assign({}, x.data() || {}, { id: x.id }))); } catch (e) { /* unreadable row */ } });
      const first = !D.loaded;
      setRecipes(list);
      D.loaded = true;
      K.refresh(first);
    }, (e) => { D.loadErr = e && e.code; D.loaded = true; K.refresh(true); });
    const setting = (name, fn) => db.doc('settings/' + name).onSnapshot((x) => { fn(x.exists ? x.data() : null); K.refresh(); }, onErr);
    setting('branding', (d) => { D.branding = { logo: (d && d.logo) || '', heroes: d && Array.isArray(d.heroes) ? d.heroes.slice() : [], approve: (d && d.approve) || '', pages: d && d.pages && typeof d.pages === 'object' ? Object.assign({}, d.pages) : {} }; });
    setting('checklists', (d) => { D.checklists = d ? K.clone(d) : { stations: {} }; });
    setting('staff', (d) => { D.staff = d && Array.isArray(d.people) ? K.clone(d) : { people: [] }; });
    setting('shiftcodes', (d) => { D.codes = d && Array.isArray(d.codes) ? K.clone(d) : { codes: [] }; });
    setting('kitchen', (d) => { D.kitchen = d ? K.clone(d) : null; });
    db.collection('events').onSnapshot((s) => { D.events = s.docs.map((x) => Object.assign(K.clone(x.data()), { id: x.id })); K.refresh(); }, onErr);
    db.collection('schedules').onSnapshot((s) => { const w = {}; s.docs.forEach((x) => { w[x.id] = K.clone(x.data()); }); D.weeks = w; K.refresh(); }, onErr);
    dateSubs();
    /* the kitchen day turns over at 4 am: follow it if the app stays open */
    setInterval(() => { if (K.day(0) !== subDay) { dateSubs(); K.refresh(true); } }, 60000);
  };
  let bugSub = null;
  K.subscribeBugs = function () {
    if (bugSub || !K.me.admin) return;
    bugSub = K.db.collection('bugs').onSnapshot((s) => { D.bugs = s.docs.map((x) => Object.assign(K.clone(x.data()), { id: x.id })); K.refresh(); }, () => {});
  };

  /* clear daily records older than `days` (the shared database has a document cap) */
  K.housekeeping = function (days) {
    const cut = K.day(-days);
    const jobs = ['prep', 'checks', 'orders', 'boards'].map((c) => K.db.collection(c).where('date', '<', cut).get().then((s) => s.docs.map((x) => c + '/' + x.id)));
    return Promise.all(jobs).then((lists) => {
      const paths = [].concat.apply([], lists);
      return paths.reduce((p, path) => p.then(() => K.db.doc(path).delete()), Promise.resolve()).then(() => paths.length);
    });
  };
})();

</script>
<script>
/* js/timers.js */
/* Kitchen timers. Durations written in a method step ("30 минути", "1 час", "10 min")
   become tap-to-start timers; running timers sit in a tray at the bottom of the screen,
   survive a reload, and ring and vibrate when they finish. Temperatures are picked out too. */
(function () {
  'use strict';
  const K = window.K, h = K.h;

  const UNIT = '(часа|часове|час|ч\\.|hours?|hrs?|h|минути|минута|мин\\.?|minutes?|mins?|секунди|секунда|сек\\.?|seconds?|secs?)';
  const NUM = '(\\d+(?:[.,]\\d+)?)';
  /* "10 минути", "10-12 min", "1,5 часа", "1 час и 30 минути" */
  const DUR = new RegExp(NUM + '(?:\\s*[-–]\\s*' + NUM + ')?\\s*' + UNIT + '(?![a-zа-я])', 'gi');
  const TEMP = /(\d+(?:[.,]\d+)?)\s*(?:°\s*[CС]?|градуса|degrees)(?![a-zа-я])/gi;

  function secondsOf(n, unit) {
    const u = unit.toLowerCase(), v = parseFloat(String(n).replace(',', '.'));
    if (/^(ч|час|hour|hr|h$)/.test(u) || u === 'h') return v * 3600;
    if (/^(сек|sec)/.test(u)) return v;
    return v * 60;
  }
  function label(sec) {

  K.recent = () => K.store.get('recent', []);

  function seed(docs) {
    const S = window.KOMAT_SEED || {}, st = S.settings || {};
    (S.recipes || []).forEach((r) => { const o = K.clone(r); delete o.id; docs['recipes/' + r.id] = o; });
    if (st.checklists) docs['settings/checklists'] = K.clone(st.checklists);
    if (st.shiftcodes) docs['settings/shiftcodes'] = K.clone(st.shiftcodes);
    if (st.kitchen) docs['settings/kitchen'] = K.clone(st.kitchen);

    const db = cl ? await cl.use('db').catch(() => null) : null;

      K.mode = 'cloud';
      K.db = db;

        if (!u) return;
        const r = await Promise.all([u.id(), u.isOwner(), u.canEdit(), typeof u.can === 'function' ? u.can('data.write') : null]);

      }).catch(() => {});
      cl.use('assets').then((a) => { K.assets = a; K.refresh(); }).catch(() => {});

        K.sample = s;

      K.mode = 'firebase';
      K.db = K.Fire.db;
      K.assets = K.Fire.assets;

      if (location.hash === '#setup') ui.authWant = 'setup';

      try { history.replaceState({ k: 0 }, '', location.hash === '#setup' ? '#recipes' : location.hash || '#' + hashFor()); } catch (e) { /* file:// */ }

      render(true);
      K.paintTimers();
      return;
    } else if (K.BUILD === 'artifact') {
      K.mode = 'none';
      render();
      return;
    } else {
      K.mode = 'local';
      K.db = new K.LocalDB(seed);
      await K.LocalAssets.init();
      K.assets = K.LocalAssets;
      K.me = { id: '', admin: true, canWrite: true };
      K.subscribeBugs();
      fromHash(location.hash);
      try { history.replaceState({ k: 0 }, '', location.hash || '#' + hashFor()); } catch (e) { /* file:// */ }

    if (K.mode === 'cloud') fromHash(location.hash);
    ui.focusSearch = ui.view === 'recipes' && finePointer();
    K.subscribe();
    render(true);
    K.paintTimers();
  }

})();

<script>
/* js/photos.js */
/* Photos of the restaurant: page headers, the napkin's K-ray mark, the courtyard cat for
   quiet moments, plating galleries and a full-screen photo viewer. */
(function () {
  'use strict';
  const K = window.K, h = K.h, D = K.D, ui = K.ui;
  const DIR = 'assets/photos/theme/';
  const PAGE = { today: 'today', orders: 'orders', schedule: 'schedule', events: 'events' };
  /* the recipe book opens on a different dish each day */
  const DAILY = ['recipes', 'salmon', 'soup', 'chocolate', 'cauliflower', 'fishcakes', 'sandwiches', 'herring'];
  K.PAGE_PHOTO_TABS = [['recipes', 'Recipes'], ['today', 'Today'], ['orders', 'Orders'], ['schedule', 'Schedule'], ['events', 'Events']];

  K.defaultPagePhoto = function (tab) {
    if (tab === 'recipes') {
      const d = Math.floor(K.kitchenNow().getTime() / 86400000);
      return DIR + DAILY[d % DAILY.length] + '.jpg';
    }
    return PAGE[tab] ? DIR + PAGE[tab] + '.jpg' : '';
  };
  /* the head chef can pick a photo per page in Branding; the recipe book also takes the first header photo */
  K.pagePhoto = function (tab) {
    const b = D.branding || {}, p = (b.pages || {})[tab];
    if (p) return K.media(p);
    if (tab === 'recipes' && b.heroes && b.heroes[0]) return K.media(b.heroes[0]);
    return K.defaultPagePhoto(tab);
  };
  /* an image that tries a second address, then gives way to a stand-in */
  K.photoWithFallback = function (src, alt, standIn, attrs) {
    return h('img', Object.assign({}, attrs, { src: src, onerror: (e) => {
      const im = e.target;
      if (alt && im.getAttribute('src') !== alt) im.src = alt;
      else if (typeof standIn === 'function') standIn(im);
      else if (standIn) im.replaceWith(standIn); else im.remove();
    } }));
  };
  K.photoLayer = function (src) {
    if (!src) return [];
    return [
      h('img', { class: 'ph-img', src: src, alt: '', fetchpriority: 'high', onerror: (e) => { e.target.remove(); } }),
      h('div', { class: 'ph-shade', 'aria-hidden': 'true' }),
    ];
  };

  /* the K mark from the napkins: a stem with rays fanning out */
  K.rays = function (cls) {
    const span = h('span', { class: 'rays' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' });
    const lines = [[0, 100, 0, 0], [0, 46, 100, 0], [0, 46, 100, 26], [0, 46, 92, 58], [0, 46, 70, 92], [0, 46, 38, 100]];
    span.innerHTML = '<svg viewBox="-4 -4 108 108" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">' +
      lines.map((l) => '<line x1="' + l[0] + '" y1="' + l[1] + '" x2="' + l[2] + '" y2="' + l[3] + '"/>').join('') + '</svg>';
    return span;
  };

  /* quiet states: the courtyard cat asleep on the steps */
  K.catRest = function (title, text, extra) {
    return h('div', { class: 'rest' },
      h('img', { class: 'rest-cat', src: DIR + 'cat.jpg', alt: 'The courtyard cat asleep on the steps', loading: 'lazy' }),
      h('strong', null, title), text ? h('p', null, text) : null, extra || null);
  };

  /* ---------- galleries ---------- */
  K.gallery = function (list, label) {
    if (!list || !list.length) return null;
    return h('div', { class: 'gallery', role: 'list', 'aria-label': label || 'Photos' }, list.map((p, i) =>
      h('button', { type: 'button', class: 'gal-item', role: 'listitem', 'aria-label': 'Open photo ' + (i + 1) + (p.title ? ': ' + p.title : ''), onclick: () => K.openPhotos(list, i) },
        h('img', { src: K.media(p.id), alt: p.title || '', loading: 'lazy', decoding: 'async' }),
        p.title ? h('span', { class: 'gal-cap' }, p.title) : null)));
  };
  K.openPhotos = function (list, i) { ui.sheet = { type: 'photos', list: list, i: i || 0 }; K.render(); };

  K.SHEETS.photos = function (S) {
    const list = S.list, n = list.length, p = list[S.i];
    if (!p) return null;
    const close = () => { ui.sheet = null; K.render(); };
    const go = (d) => { if (n < 2) return; S.i = (S.i + d + n) % n; K.render(); };
    const img = h('img', { class: 'lb-img', src: K.media(p.id), alt: p.title || 'Photo ' + (S.i + 1) });
    const box = h('div', { class: 'lightbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Photo ' + (S.i + 1) + ' of ' + n, tabindex: '-1',
      onkeydown: (e) => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); },
      onclick: (e) => { if (e.target === e.currentTarget || e.target.classList.contains('lb-stage')) close(); } },
      h('div', { class: 'lb-top' },
        n > 1 ? h('span', { class: 'lb-count mono' }, (S.i + 1) + ' / ' + n) : h('span'),
        h('button', { type: 'button', class: 'icon-btn on-dark', 'aria-label': 'Close', onclick: close }, K.icon('close'))),
      h('div', { class: 'lb-stage' }, img),
      p.title ? h('p', { class: 'lb-cap' }, p.title) : null,
      n > 1 ? h('div', { class: 'lb-nav' },
        h('button', { type: 'button', class: 'icon-btn on-dark', 'aria-label': 'Previous photo', onclick: () => go(-1) }, K.icon('back')),
        h('div', { class: 'lb-dots', 'aria-hidden': 'true' }, list.map((x, j) => h('span', { class: j === S.i ? 'on' : '' }))),
        h('button', { type: 'button', class: 'icon-btn on-dark', 'aria-label': 'Next photo', onclick: () => go(1) }, K.icon('next'))) : null);
    let x0 = null, y0 = 0;
    box.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    box.addEventListener('touchend', (e) => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
      else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) close();
    });
    setTimeout(() => { if (!box.contains(document.activeElement)) box.focus({ preventScroll: true }); }, 0);
    return box;
  };
})();

</script>
<script>
/* js/recipes.js */
/* Recipe book: list and search, recipe and component pages, scaling, cook mode. */
(function () {
  'use strict';
  const K = window.K, h = K.h, D = K.D, ui = K.ui;

  /* ---------- list ---------- */
  function tally() {
    const d = D.recipes.filter((r) => r.type === 'dish').length, r = D.recipes.length - d, out = [];
    if (d) out.push(d + (d === 1 ? ' dish' : ' dishes'));

  }
  const countIn = (c) => D.recipes.filter((r) => r.category === c).length;
  /* adding lives in Settings and in empty folders, so the list stays clear for searching */
  K.openAdd = function (cat) { ui.sheet = { type: 'add', cat: cat || '' }; K.render(); };
  K.SHEETS.add = function (S) {
    const pick = (fn) => () => { ui.sheet = null; fn(); };
    return K.sheet('Add to the book', h('div', { class: 'settings' },
      K.sample ? h('button', { class: 'set-link', type: 'button', onclick: pick(() => K.scanNew(S.cat)) }, K.icon('camera'),
        h('span', null, h('b', null, 'Scan a recipe sheet'), h('span', { class: 'muted' }, 'Take a photo; Claude types it up for you to check')), K.icon('next')) : null,
      h('button', { class: 'set-link', type: 'button', onclick: pick(() => K.startEdit(null, S.cat, 'dish')) }, K.icon('chef'),
        h('span', null, h('b', null, 'New dish'), h('span', { class: 'muted' }, 'A plate on the menu, built from several recipes')), K.icon('next')),
      h('button', { class: 'set-link', type: 'button', onclick: pick(() => K.startEdit(null, S.cat, 'recipe')) }, K.icon('note'),
        h('span', null, h('b', null, 'New recipe'), h('span', { class: 'muted' }, 'One prep: a sauce, a dough, a stock')), K.icon('next'))));
  };
  const addBtn = (cat) => h('div', { class: 'btns center' }, h('button', { class: 'btn primary', type: 'button', onclick: () => K.openAdd(cat) }, K.icon('plus'), 'Add a recipe'));

  K.V.recipes = function () {
    const body = h('div', { class: 'page' });
    const src = K.pagePhoto('recipes');
    body.append(h('section', { class: 'hero photo slim' + (src ? '' : ' speckle') }, K.photoLayer(src), K.rays('ph-rays'),
      h('div', { class: 'wrap hero-in' },
        h('h1', { class: 'hero-title' }, 'What are we ', h('em', null, 'cooking'), '?'),
        D.recipes.length ? h('p', { class: 'hero-sub' }, tally()) : null)));
    const w = h('div', { class: 'wrap' });
    body.append(w);
    const q = h('input', {
      class: 'search-in', id: 'q', type: 'search', placeholder: 'Search a dish, prep or ingredient', 'aria-label': 'Search recipes', value: ui.q,
      autocomplete: 'off', autocapitalize: 'off', spellcheck: false, enterkeyhint: 'search',
      oninput: (e) => { ui.q = e.target.value; results(); },
      onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
    });
    /* the search rides along under the header, so it is always one tap away */
    w.append(h('div', { class: 'search-dock', id: 'sdock' }, h('div', { class: 'search' }, K.icon('search'), q,
      ui.q ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': 'Clear search', onclick: () => { ui.q = ''; K.render(); const el = document.getElementById('q'); if (el) el.focus(); } }, K.icon('close')) : null)));
    if (D.loaded && D.recipes.length) {
      const fs = K.folders().filter((c) => countIn(c) > 0 || ui.cat === c);
      w.append(h('div', { class: 'chips', role: 'group', 'aria-label': 'Folder' },
        [['', 'All', D.recipes.length]].concat(fs.map((c) => [c, c, countIn(c)])).map((c) =>
          h('button', { class: 'chip', type: 'button', 'aria-pressed': ui.cat === c[0] ? 'true' : 'false', onclick: () => { ui.cat = c[0]; K.render(); } }, c[1], h('span', { class: 'cn' }, String(c[2]))))));
      w.append(h('div', { class: 'chips filters' },
        K.seg([['', 'Everything'], ['dish', 'Dishes'], ['recipe', 'Recipes']], ui.type, (v) => { ui.type = v; K.render(); }, { 'aria-label': 'Show', class: 'seg small-seg' }),
        h('button', { type: 'button', class: 'chip', 'aria-pressed': ui.onMenu ? 'true' : 'false', onclick: () => { ui.onMenu = !ui.onMenu; K.render(); } }, 'On the menu')));
    }
    w.append(h('div', { id: 'results' }));
    return { body: body, after: () => { results(); dockState(); if (ui.focusSearch) { ui.focusSearch = false; const el = document.getElementById('q'); if (el) el.focus(); } } };
  };
  /* a soft backdrop behind the search once it sticks under the header */
  function dockState() {
    const d = document.getElementById('sdock'), top = document.querySelector('.top');

  }
  window.addEventListener('scroll', dockState, { passive: true });
  /* tapping Recipes again jumps straight into the search */
  K.focusSearch = function () {
    window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const el = document.getElementById('q');
    if (el) el.focus({ preventScroll: true });
  };

  function hay(r, c) {
    if (c) return (c.name + ' ' + c.ingredients.map((i) => i.n).join(' ') + ' ' + (c._alt || '')).toLowerCase();
    return (r.name + ' ' + r.category + ' ' + r.ingredients.map((i) => i.n).join(' ') + ' ' + r.components.map((x) => x.name + ' ' + x.ingredients.map((i) => i.n).join(' ')).join(' ') + ' ' + (r._alt || '')).toLowerCase();
  }
  function matchesQ(text, q) { return text.includes(q) || (/[a-z]/.test(q) && K.latin(text).includes(q)); }
  /* the first ingredient that matched, to show why a result is here */
  function whyMatch(r, c, q) {
    const nm = (c ? c.name : r.name).toLowerCase();
    if (matchesQ(nm, q)) return '';
    const lists = c ? [c.ingredients] : K.allIngLists(r);
    for (const l of lists) for (const i of l) { const t = (i.n + ' ' + (i.o || '') + ' ' + K.tx(i.n)).toLowerCase(); if (matchesQ(t, q)) return i.n; }
    if (!c) for (const x of r.components) if (matchesQ(x.name.toLowerCase(), q)) return x.name;
    return '';
  }
  function entries() {
    const q = ui.q.trim().toLowerCase(), out = [], showComps = !!q || ui.type === 'recipe';
    D.recipes.forEach((r) => {
      out.push({ r: r, ci: -1, name: r.name, type: r.type });
      if (showComps) r.components.forEach((c, i) => out.push({ r: r, ci: i, c: c, name: c.name, type: 'recipe' }));
    });
    return out.filter((en) => {
      if (ui.cat && en.r.category !== ui.cat) return false;
      if (ui.type && en.type !== ui.type) return false;
      if (ui.onMenu && en.r.onMenu === false) return false;
      if (!q) return true;
      return matchesQ(hay(en.r, en.c), q);
    }).sort((a, b) => {
      if (q) {
        const rank = (x) => { const n = x.name.toLowerCase(); return n.startsWith(q) ? 0 : n.includes(q) ? 1 : 2; };
        if (rank(a) !== rank(b)) return rank(a) - rank(b);
      }
      return a.name.localeCompare(b.name);
    });
  }
  const TINTS = 6;
  function tint(s) { let x = 0; for (const ch of String(s)) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return 't' + (x % TINTS); }
  /* an illustration for a recipe that has no photo yet (a real photo always wins) */
  K.artFor = (r) => (r && !r.photo && (window.KOMAT_ART || []).includes(r.id) ? 'assets/photos/art/' + r.id + '.jpg' : '');
  K.artSrc = (r) => (r && (window.KOMAT_ART_SRC || {})[r.id]) || '';
  /* the parts of a dish have their own illustrations (assets/photos/art/parts/<part id>.jpg) */
  K.partArt = (r, ci) => { const c = r && r.components[ci]; return c && c.cid && (window.KOMAT_PART_ART || []).includes(c.cid) ? 'assets/photos/art/parts/' + c.cid + '.jpg' : ''; };
  function thumb(r, name) {
    const letter = () => h('div', { class: 'thumb ph ' + tint((r && r.category) || name), 'aria-hidden': 'true' }, (name || '?').charAt(0).toUpperCase());
    const ph = r && (r.photo || (r.gallery[0] && r.gallery[0].id));
    const src = ph ? K.media(ph) : K.artFor(r);
    return src ? K.photoWithFallback(src, ph ? '' : K.artSrc(r), letter(), { class: 'thumb', alt: '', loading: 'lazy', decoding: 'async' }) : letter();
  }
  function card(en, q) {
    const r = en.r, c = en.c, why = q ? whyMatch(r, c, q) : '';
    const part = c || r, isDish = !c && r.type === 'dish';
    return h('button', { class: 'rcard', type: 'button', onclick: () => K.go('recipe', { id: r.id, comp: en.ci }) },
      c ? thumb(null, c.name) : thumb(r, r.name),
      h('div', { class: 'card-txt' },
        h('span', { class: 'kicker' + (isDish ? ' dish' : '') }, isDish ? 'Dish' : 'Recipe'),
        h('span', { class: 'card-name' }, part.name),
        h('span', { class: 'card-meta' },
          part.yieldQty ? h('span', null, K.yieldText(part.yieldQty, part.yieldUnit)) : null,
          isDish && r.components.length ? h('span', null, r.components.length + (r.components.length === 1 ? ' part' : ' parts')) : part.ingredients.length ? h('span', null, part.ingredients.length + ' ingredients') : null,
          K.stationOf(r, c) && K.ST[K.stationOf(r, c)] ? h('span', null, K.ST[K.stationOf(r, c)]) : null),
        c ? h('span', { class: 'card-in' }, 'In ' + r.name) : null,
        why ? h('span', { class: 'card-why' }, 'Has ' + why) : null,
        !c && (r.onMenu === false || r.videos.length) ? h('span', { class: 'card-pills' },
          r.onMenu === false ? h('span', { class: 'pill muted' }, 'Off the menu') : null,
          r.videos.length ? h('span', { class: 'pill' }, K.icon('play'), 'Plating video') : null) : null));
  }
  function results() {
    const box = document.getElementById('results');
    if (!box) return;
    box.textContent = '';
    if (!D.loaded) { box.append(h('div', { class: 'empty' }, h('strong', null, 'Loading recipes'), 'One moment.')); return; }

      /* a brand-new kitchen database: bring the book in from a backup, or start from the recipes built into the app */
      if (K.mode === 'firebase' && K.me.admin) {
        box.append(K.catRest('The book is ready for its recipes', 'Load the backup from the Claude version to bring everything across, or start with the recipes built into the app.',
          h('div', { class: 'btns center' },
            h('button', { class: 'btn primary', type: 'button', disabled: !!ui.backupBusy, onclick: () => K.importBackup() }, K.icon('upload'), ui.backupBusy ? 'Loading…' : 'Load a backup'),
            h('button', { class: 'btn', type: 'button', disabled: !!ui.backupBusy, onclick: () => {
              ui.backupBusy = true; K.render();
              K.db.importAll(K.seedDocs(), { keep: true }).then(() => { ui.backupBusy = false; K.render(); K.toast('The built-in recipes are in'); }, (e) => { ui.backupBusy = false; K.render(); K.writeFailed(e); });
            } }, 'Start with the built-in recipes'))));
        return;
      }
      box.append(K.catRest('The book is ready for its first recipe', K.me.admin ? 'Add a dish, a prep, or scan a recipe sheet.' : 'Recipes appear here as soon as the head chef adds them.',
        K.me.admin ? addBtn('') : null));

    if (!list.length) {
