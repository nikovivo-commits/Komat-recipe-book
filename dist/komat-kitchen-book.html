<meta charset="utf-8">
<title>Komat Kitchen Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a steel "pass" band (header, page heads) over pale board-formed concrete; stoneware-white
   cards hold the work. Phones get one column and a thumb-reach tab bar; wide screens split work | brief. */
:root {
  --ground: #E6E7E4;
  --surface: #FBFBF8;
  --surface-2: #F0F1ED;
  --ink: #1C1B1A;
  --muted: #5D605C;
  --line: #D2D4CF;
  --steel: #1F2020;
  --steel-2: #2A2B2B;
  --on-steel: #F2F2EE;
  --steel-muted: #A7AAA6;
  --apron: #5B3631;
  --apron-ink: #FFFFFF;
  --apron-soft: #EFE3DF;
  --apron-on-steel: #E0AFA3;
  --ready: #2E7A4E;
  --ready-ink: #FFFFFF;
  --ready-soft: #DFEEE4;
  --todo: #EDBE45;
  --todo-ink: #3D2C00;
  --todo-soft: #FBF0D2;
  --urgent: #C42F1C;
  --urgent-ink: #FFFFFF;
  --urgent-soft: #F8E0DA;
  --hot: #B8561F;
  --cold: #2C6A98;
  --pass: #7A6626;
  --shadow: 0 1px 0 rgba(28, 27, 26, .04), 0 8px 24px -14px rgba(28, 27, 26, .35);
  --display: "Fira Sans Extra Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --sans: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --r-sm: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --tabbar-h: 64px;
  --top-h: 63px;
  --low: #9A720A;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121312; --surface: #1C1D1C; --surface-2: #242524; --ink: #ECEDE9; --muted: #A3A6A1; --line: #353735;
    --steel: #0C0C0C; --steel-2: #1A1A1A; --on-steel: #F2F2EE; --steel-muted: #9B9E9A;
    --apron: #D09B90; --apron-ink: #1E1210; --apron-soft: #3A2723; --apron-on-steel: #E0AFA3;
    --ready: #5DB583; --ready-ink: #0B1F13; --ready-soft: #1C3226;
    --todo: #EDBE45; --todo-ink: #2A1E00; --todo-soft: #3A3014;
    --urgent: #F26B56; --urgent-ink: #1E0603; --urgent-soft: #3E1B15;
    --hot: #E38A55; --cold: #74AAD8; --pass: #CDB566; --low: #EDBE45;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #121312; --surface: #1C1D1C; --surface-2: #242524; --ink: #ECEDE9; --muted: #A3A6A1; --line: #353735;
  --steel: #0C0C0C; --steel-2: #1A1A1A; --on-steel: #F2F2EE; --steel-muted: #9B9E9A;
  --apron: #D09B90; --apron-ink: #1E1210; --apron-soft: #3A2723; --apron-on-steel: #E0AFA3;
  --ready: #5DB583; --ready-ink: #0B1F13; --ready-soft: #1C3226;
  --todo: #EDBE45; --todo-ink: #2A1E00; --todo-soft: #3A3014;
  --urgent: #F26B56; --urgent-ink: #1E0603; --urgent-soft: #3E1B15;
  --hot: #E38A55; --cold: #74AAD8; --pass: #CDB566; --low: #EDBE45;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--steel); }
body.locked { overflow: hidden; }
h1, h2, h3, p, figure { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
img, video { max-width: 100%; }
:focus-visible { outline: 3px solid var(--apron); outline-offset: 2px; }
.top :focus-visible, .phead :focus-visible, .hero :focus-visible, .tabbar :focus-visible, .cook :focus-visible, .scanbox :focus-visible { outline-color: var(--apron-on-steel); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.main { min-height: 60vh; }
body.has-tabs .main { padding-bottom: 24px; }
.page { padding-block: 0 32px; }
.wrap.page { padding-block: 20px 40px; }
.narrow { max-width: 760px; }
.grow { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.measure { max-width: 62ch; }
.lead { font: 600 1.25rem/1.35 var(--sans); }
.prose { white-space: pre-wrap; line-height: 1.6; max-width: 68ch; }
.hint { color: var(--muted); font-size: .9rem; }
.none { color: var(--muted); }
.label { font: 700 .72rem/1.2 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.label.bad { color: var(--urgent); }
.label.on-dark { color: var(--steel-muted); }
.eyebrow { font: 700 .74rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--apron-on-steel); }
.kicker { font: 700 .72rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.kicker.dish { color: var(--apron); }
.stack { display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two.tight { gap: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btns.end { justify-content: flex-end; margin-top: 8px; }
.btns.center { justify-content: center; margin-top: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.only-wide { display: none; }
@media (min-width: 1000px) { .only-wide { display: block; } .only-narrow { display: none; } }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } .two.tight { grid-template-columns: 1fr 1fr; } .hide-xs { display: none; } }

/* speckled stoneware on the dark band */
.speckle {
  background-color: var(--steel);
  background-image:
    radial-gradient(circle, rgba(255, 255, 255, .07) 0 1px, transparent 1.6px),
    radial-gradient(circle, rgba(255, 255, 255, .045) 0 .8px, transparent 1.3px),
    radial-gradient(circle, rgba(0, 0, 0, .35) 0 1px, transparent 1.6px);
  background-size: 23px 19px, 37px 31px, 17px 29px;
  background-position: 0 0, 11px 7px, 5px 13px;
}

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--apron); border-color: var(--apron); color: var(--apron-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--apron); }
.btn.light { background: var(--on-steel); border-color: var(--on-steel); color: #1C1B1A; }
.btn.ghost-light { background: transparent; border-color: rgba(242, 242, 238, .4); color: var(--on-steel); }
.btn.ghost-light:hover:not(:disabled) { border-color: var(--on-steel); }
.btn.danger { color: var(--urgent); border-color: currentColor; background: transparent; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: .9rem; border-radius: 9px; }
.btn.big { min-height: 58px; padding: 0 22px; font-size: 1.1rem; border-radius: 14px; }
.btn.wide { width: 100%; min-height: 54px; font-size: 1.05rem; }
.btn[aria-pressed="true"] { border-color: var(--apron); box-shadow: inset 0 0 0 1px var(--apron); }
.btn .ico, .icon-btn .ico, .back-btn .ico { width: 20px; height: 20px; }
.ico { display: inline-flex; flex: none; width: 1.1em; height: 1.1em; }
.ico svg { width: 100%; height: 100%; }
.icon-btn { display: inline-grid; place-items: center; flex: none; width: 42px; height: 42px; border-radius: 10px; border: 0; background: transparent; color: inherit; }
.icon-btn:hover:not(:disabled) { background: color-mix(in srgb, currentColor 10%, transparent); }
.icon-btn.on { background: var(--apron); color: var(--apron-ink); }
.icon-btn.on-dark { color: var(--on-steel); }
.link-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 0; color: var(--muted); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.link-btn.strong { color: var(--ink); }
.link-btn .ico { width: 18px; height: 18px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: .9rem; }
.chip .cn { font: 600 .78rem var(--mono); opacity: .6; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { min-height: 38px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
.seg.on-dark { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .12); }
.seg.on-dark button { color: var(--steel-muted); }
.seg.on-dark button[aria-pressed="true"] { background: var(--on-steel); color: #1C1B1A; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; background: var(--apron-soft); color: var(--apron); font: 700 .75rem/1.5 var(--sans); }
.pill .ico { width: 12px; height: 12px; }
.pill.muted { background: var(--surface-2); color: var(--muted); }
.spinner { display: inline-block; width: 1em; height: 1em; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.upl { display: inline-flex; align-items: center; font-size: .85rem; color: var(--steel-muted); font-weight: 600; }

/* ---------- header and tabs ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--steel); color: var(--on-steel); border-bottom: 1px solid rgba(255, 255, 255, .06); }
.top-in { display: flex; align-items: center; gap: 10px; max-width: 1180px; margin: 0 auto; min-height: 62px; padding: 6px var(--gutter-r) 6px var(--gutter-l); }
.brand { display: inline-flex; align-items: center; border: 0; background: none; padding: 4px 0; color: inherit; }
.logo { display: block; height: 42px; width: auto; max-width: 140px; object-fit: contain; }
.wordmark { font: 700 1.5rem/1 var(--display); letter-spacing: .2em; }
.tabs-desk { display: none; gap: 2px; margin-left: 18px; }
.dtab { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: var(--steel-muted); font-weight: 700; }
.dtab:hover { color: var(--on-steel); }
.dtab[aria-current="page"] { background: rgba(255, 255, 255, .1); color: var(--on-steel); }
.dtab .ico { width: 20px; height: 20px; }
.tab-ico { position: relative; display: inline-flex; }
.badge { position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--urgent); color: #fff; font: 800 .68rem/18px var(--sans); text-align: center; box-shadow: 0 0 0 2px var(--steel); }
.badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: -2px; right: -4px; background: var(--todo); }
.langsw { display: inline-flex; padding: 2px; border-radius: 9px; background: rgba(255, 255, 255, .08); }
.langsw button { min-width: 38px; min-height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--steel-muted); font: 700 .8rem var(--sans); letter-spacing: .04em; }
.langsw button[aria-pressed="true"] { background: var(--on-steel); color: #1C1B1A; }
.settings .langsw { background: var(--surface-2); }
.settings .langsw button { color: var(--muted); }
.settings .langsw button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.top.sub .top-in { gap: 8px; }
.back-btn { display: inline-flex; align-items: center; gap: 4px; min-height: 42px; padding: 0 10px 0 4px; border: 0; border-radius: 10px; background: transparent; color: var(--on-steel); font-weight: 700; }
.back-btn:hover { background: rgba(255, 255, 255, .08); }
.sub-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 1.15rem/1 var(--display); letter-spacing: .01em; color: var(--steel-muted); text-align: center; }
.sub-acts { display: flex; align-items: center; gap: 6px; }
.sub-acts .btn:not(.primary) { background: transparent; border-color: rgba(242, 242, 238, .35); color: var(--on-steel); }
.sub-acts .btn.primary { background: var(--apron-on-steel); border-color: var(--apron-on-steel); color: #1E1210; }
.sub-acts .icon-btn { color: var(--on-steel); }
.sub-acts .icon-btn.on { background: var(--on-steel); color: #1C1B1A; }
@media (max-width: 560px) { .sub-title { display: none; } .top.sub .sub-acts { margin-left: auto; } }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, 1fr); padding: 4px max(6px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); background: var(--steel); border-top: 1px solid rgba(255, 255, 255, .07); }
.mtab { position: relative; display: grid; justify-items: center; gap: 2px; min-width: 0; min-height: 56px; padding: 6px 2px 4px; border: 0; background: transparent; color: var(--steel-muted); font: 700 .72rem/1.1 var(--sans); }
.mtab .ico { width: 24px; height: 24px; }
.mtab[aria-current="page"] { color: var(--on-steel); }
.mtab[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--apron-on-steel); }
.tab-lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
body.has-tabs { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .tabs-desk { display: flex; }
  .tabbar { display: none; }
  body.has-tabs { padding-bottom: 0; }
}
.banner { display: grid; gap: 4px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.banner.bad { background: var(--urgent-soft); border-color: var(--urgent); color: var(--ink); }
.banner.bad b { color: var(--urgent); }
.banner.warn { background: var(--todo-soft); border-color: var(--todo); }
#app > .banner { max-width: 1180px; margin: 12px auto 0; width: calc(100% - 32px); }

/* ---------- loading ---------- */
.boot { display: grid; justify-items: center; gap: 14px; padding: 18vh 16px; text-align: center; }
.boot-mark { display: grid; place-items: center; width: 104px; height: 104px; border-radius: 28px; background: var(--steel); color: var(--on-steel); }
.boot-mark .logo { height: 70px; }
.display { font: 700 clamp(2rem, 7vw, 3rem)/1 var(--display); }

/* ---------- hero and page heads ---------- */
.hero, .phead { position: relative; isolation: isolate; color: var(--on-steel); overflow: hidden; background-color: var(--steel); }
/* restaurant photo under the title, darkened top and bottom so the header and words stay readable */
.ph-img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: center 45%; }
.ph-shade { position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(10, 10, 10, .62) 0%, rgba(10, 10, 10, .18) 34%, rgba(10, 10, 10, .3) 60%, rgba(10, 10, 10, .88) 100%); }
.rays { display: block; pointer-events: none; }
.rays svg { display: block; width: 100%; height: 100%; }
.ph-rays { position: absolute; z-index: 0; right: -26px; bottom: -36px; width: 180px; height: 180px; color: var(--apron-on-steel); opacity: .26; }
.phead.photo .ph-rays, .hero.photo .ph-rays { opacity: .34; }
.hero-in { position: relative; z-index: 1; display: grid; gap: 6px; padding-block: 26px 56px; }
.hero-title { font: 700 clamp(2.2rem, 8.6vw, 4rem)/.95 var(--display); letter-spacing: -.01em; text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
.hero-title em { font-style: normal; color: var(--apron-on-steel); }
.hero-sub { color: rgba(242, 242, 238, .86); max-width: 46ch; font-weight: 600; }
.hero.slim .hero-in { padding-block: 30px 54px; }
@media (min-width: 900px) { .hero.slim .hero-in { padding-block: 64px 64px; } }
.phead-in { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; padding-block: 22px 22px; }
.phead.photo .phead-in { padding-block: 40px 20px; }
.phead.photo .ptitle { text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
.phead.photo .psub { color: rgba(242, 242, 238, .86); }
/* the header floats over the page photo until you scroll */
.top { transition: background-color .2s ease, border-color .2s ease; }
body.over-photo:not(.scrolled) .top.over { background-color: transparent; border-bottom-color: transparent; }
.top.over + .main > .page > .phead:first-child, .top.over + .main > .page > .hero:first-child { margin-top: calc(-1 * var(--top-h)); padding-top: var(--top-h); }
.ptitle { font: 700 clamp(2.2rem, 7vw, 3.2rem)/.95 var(--display); }
.psub { display: flex; align-items: center; gap: 8px; color: var(--steel-muted); font-weight: 600; margin-top: 6px; }
.phead-side { display: grid; gap: 10px; justify-items: start; }
@media (min-width: 700px) { .phead-side { justify-items: end; } }
.daydot { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5); }

/* ---------- recipe list ---------- */
.search-dock { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); z-index: 15; margin: -38px calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l)); padding: 8px var(--gutter-r) 8px var(--gutter-l); transition: background-color .15s ease, box-shadow .15s ease; }
.search-dock.stuck { background: var(--ground); box-shadow: 0 1px 0 var(--line); }
.search-dock.stuck .search { box-shadow: none; }
.search { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; min-height: 60px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .35); color: var(--muted); }
.search .ico { width: 22px; height: 22px; }
.search-in { flex: 1; min-width: 0; min-height: 56px; border: 0; background: transparent; color: var(--ink); font-size: 1.08rem; outline: none; }
.search:focus-within { border-color: var(--apron); }
.search.small { margin: 14px 0; min-height: 50px; box-shadow: none; }
.search.small .search-in { min-height: 46px; font-size: 1rem; }
.chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l)); padding: 8px var(--gutter-r) 2px var(--gutter-l); scrollbar-width: none; }
.chips.filters { padding-top: 6px; }
.chips .seg { flex: none; }
.seg.small-seg { padding: 2px; }
.seg.small-seg button { min-height: 34px; padding: 0 12px; font-size: .86rem; }
.chips::-webkit-scrollbar { display: none; }
.group { margin-top: 22px; }
.group-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; font: 700 1.6rem/1.05 var(--display); }
.group-title .n, .block-title .n { font: 600 .8rem var(--mono); color: var(--muted); }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 980px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.rcard { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; padding: 8px 12px 8px 8px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); color: inherit; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease; }

.thumb { display: block; width: 88px; height: 88px; border-radius: 10px; object-fit: cover; background: var(--surface-2); }
.thumb.ph { display: grid; place-items: center; font: 700 2.4rem/1 var(--display); color: rgba(255, 255, 255, .92); }
.t0 { background: #6B4A3F; } .t1 { background: #4E5B4A; } .t2 { background: #3F5566; } .t3 { background: #7A5A2E; } .t4 { background: #5A4A63; } .t5 { background: #5E5F5B; }
.card-txt { display: grid; gap: 3px; min-width: 0; }

@media (max-width: 639px) {
  .grid { gap: 8px; }
  .rcard { grid-template-columns: 66px minmax(0, 1fr); gap: 12px; padding: 6px 10px 6px 6px; border-radius: 12px; }

  .rcard .kicker { font-size: .66rem; }
}
@media (min-width: 980px) {
  .rcard { grid-template-columns: 1fr; padding: 0; overflow: hidden; align-items: start; }
  .rcard .thumb { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 0; }
  .rcard .card-txt { padding: 4px 14px 14px; }
}
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.mini { flex: none; display: grid; grid-template-columns: 44px auto; align-items: center; gap: 10px; max-width: 240px; padding: 6px 14px 6px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-weight: 700; font-size: .9rem; }
.mini .thumb { width: 44px; height: 44px; border-radius: 8px; }

.mini span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { display: grid; gap: 6px; justify-items: center; margin-top: 24px; padding: 30px 20px; border: 1.5px dashed var(--line); border-radius: 16px; text-align: center; color: var(--muted); }
.empty strong { color: var(--ink); font: 700 1.7rem/1.1 var(--display); }

/* ---------- recipe page ---------- */
.rhead { display: grid; gap: 20px; }
.rhead-txt { display: grid; gap: 14px; align-content: start; min-width: 0; }
.dish-photo-btn { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 16px; background: none; cursor: zoom-in; }
.dish-photo { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 16px; background: var(--surface-2); box-shadow: var(--shadow); }
.photo-count { position: absolute; right: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(0, 0, 0, .62); color: #fff; font: 700 .82rem/1.2 var(--sans); }
.photo-count .ico { width: 16px; height: 16px; }
.dish-photo-btn.art { cursor: default; margin: 0; }
.art-tag { position: absolute; left: 10px; bottom: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, .6); color: #fff; font: 700 .76rem/1.2 var(--sans); }
/* the product photo or letter on order lines */
.pthumb { flex: none; display: block; width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
img.pthumb { background: var(--surface-2); }
.pthumb.ph { display: grid; place-items: center; color: rgba(255, 255, 255, .92); font: 700 1.3rem/1 var(--display); text-transform: uppercase; }
/* the photo must not be dragged or long-pressed on its own: the whole card moves */
.pcard { -webkit-touch-callout: none; }
.pcard img { pointer-events: none; -webkit-user-drag: none; user-select: none; }
img.pc-mono { width: min(230px, 30vh, 100%); width: min(230px, 30dvh, 100%); height: auto; aspect-ratio: 1; border-radius: 20px; object-fit: cover; box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .5); }
.sum-row { grid-template-columns: 44px minmax(0, 1fr) auto auto; }
.sum-row .input { grid-column: 2 / -1; }
.stock-name { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
.stock-txt { display: grid; min-width: 0; }
.stock-txt .muted { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oline { grid-template-columns: 40px auto minmax(0, 1fr); align-items: center; }
.oline .pthumb { width: 40px; height: 40px; }
@media (min-width: 900px) { .rhead.has-photo { grid-template-columns: 5fr 6fr; gap: 36px; align-items: start; } .dish-photo { aspect-ratio: 4 / 3; } .rhead.has-photo .dish-photo-btn { position: sticky; top: 80px; } }
.rtitle { font: 700 clamp(2.2rem, 7vw, 3.4rem)/.98 var(--display); overflow-wrap: anywhere; }
.meta-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font: 700 .8rem/1.3 var(--sans); color: var(--muted); }
.mchip .ico { width: 15px; height: 15px; }
.mchip.st-hot { color: var(--hot); border-color: currentColor; background: transparent; }
.mchip.st-cold { color: var(--cold); border-color: currentColor; background: transparent; }
.mchip.st-pass { color: var(--pass); border-color: currentColor; background: transparent; }
.mchip.off { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.partof { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; }
.partof b { flex: 1; }
.partof:hover { border-color: var(--apron); }
.parts { display: grid; gap: 6px; }
.parts ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.parts li button { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; width: 100%; min-height: 46px; padding: 8px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font-weight: 700; }
.parts li button:hover .pname { color: var(--apron); }
.parts li button.has-thumb { grid-template-columns: 54px 1fr auto; }
.pthumb-wrap { position: relative; width: 54px; height: 40px; }
.part-thumb { display: block; width: 54px; height: 40px; object-fit: cover; border-radius: 8px; background: var(--surface-2); }
.pthumb-wrap .pn { position: absolute; left: -6px; top: -6px; width: 22px; height: 22px; font-size: .72rem; box-shadow: 0 0 0 2px var(--ground); }
.pn, .part-n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--apron); color: var(--apron-ink); font: 700 .85rem var(--mono); }
.part-n .ico { width: 16px; height: 16px; }
.jump { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 10; display: flex; gap: 6px; overflow-x: auto; margin: 22px calc(-1 * var(--gutter-l)) 0 calc(-1 * var(--gutter-l)); padding: 8px var(--gutter-r) 8px var(--gutter-l); background: var(--ground); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: .88rem; }
.part { margin-top: 30px; padding-top: 22px; border-top: 2px solid var(--ink); scroll-margin-top: 130px; }
.part.solo { border-top: 0; padding-top: 0; }
.part-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
.part-head h2 { font: 700 clamp(1.6rem, 5vw, 2.1rem)/1.05 var(--display); }
.part-link { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 5px; }
.part-link:hover { text-decoration-color: var(--apron); }
.sec-title { font: 700 1.8rem/1.05 var(--display); margin-bottom: 12px; }
.note { margin-top: 14px; padding: 10px 14px; border-left: 3px solid var(--apron); background: var(--surface); border-radius: 0 10px 10px 0; }
.clean { font-size: .88rem; color: var(--muted); }
.clean b { color: var(--ink); }

.allergens { display: grid; gap: 8px; padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.al-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: baseline; }
.al-status { font-size: .8rem; font-weight: 700; color: var(--todo-ink); background: var(--todo-soft); padding: 2px 8px; border-radius: 6px; }
.al-status.ok { color: var(--ready); background: var(--ready-soft); }
.al-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.al { padding: 4px 10px; border-radius: 6px; background: var(--todo-soft); color: var(--todo-ink); border: 1.5px solid var(--todo); font: 800 .85rem/1.2 var(--sans); }
.al-chips.mini { margin: 0 0 8px; }
.al-chips.mini .al { padding: 2px 7px; font-size: .72rem; }
.al-src summary { cursor: pointer; font-size: .85rem; font-weight: 700; color: var(--muted); }
.al-src ul { margin: 6px 0 0; padding-left: 18px; font-size: .88rem; color: var(--muted); }
.al-src b { color: var(--ink); }

.scaler { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r); background: var(--steel); color: var(--on-steel); }
.scaler .label { color: var(--steel-muted); }
.sc-row { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
.sc-yield { display: flex; align-items: baseline; gap: 10px; }
.sc-in { width: 5.5ch; min-width: 0; background: transparent; border: 0; border-bottom: 2px solid var(--apron-on-steel); color: var(--on-steel); font: 700 2rem/1.1 var(--mono); padding: 0 2px; -moz-appearance: textfield; appearance: textfield; }
.sc-in::-webkit-outer-spin-button, .sc-in::-webkit-inner-spin-button, .mul input::-webkit-outer-spin-button, .mul input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sc-unit { font-weight: 700; color: var(--steel-muted); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.preset { min-width: 46px; min-height: 40px; padding: 0 10px; border-radius: 9px; border: 1.5px solid rgba(242, 242, 238, .3); background: transparent; color: var(--on-steel); font: 700 .95rem var(--mono); }
.preset[aria-pressed="true"] { background: var(--on-steel); color: #1C1B1A; border-color: var(--on-steel); }
.mul { display: inline-flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 8px; border-radius: 9px; border: 1.5px solid rgba(242, 242, 238, .3); font: 700 .95rem var(--mono); }
.mul input { width: 3.4em; min-width: 0; border: 0; background: transparent; color: var(--on-steel); font: 700 .95rem var(--mono); -moz-appearance: textfield; appearance: textfield; }
.sc-note { min-height: 1.2em; font-size: .85rem; color: var(--apron-on-steel); }
.sc-note:empty { display: none; }
.scaler.compact { margin: 6px 0 4px; padding: 10px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.scaler.compact .sc-in { font-size: 1.5rem; color: var(--ink); border-bottom-color: var(--apron); }
.scaler.compact .sc-unit, .scaler.compact .label { color: var(--muted); }
.scaler.compact .preset, .scaler.compact .mul { border-color: var(--line); color: var(--ink); }
.scaler.compact .mul input { color: var(--ink); }
.scaler.compact .preset[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.scaler.compact .sc-note { color: var(--apron); }

.cols { display: grid; gap: 22px; }
@media (min-width: 900px) { .cols { grid-template-columns: 5fr 7fr; gap: 40px; } }
.col { min-width: 0; display: grid; gap: 8px; align-content: start; }
.col-title { font: 700 .76rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ings, .steps { list-style: none; margin: 0; padding: 0; }
.ing { display: grid; grid-template-columns: 6.4rem minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 11px 4px; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
.amt { justify-self: end; text-align: right; font: 700 .98rem/1.3 var(--mono); white-space: nowrap; border: 0; background: none; padding: 0; color: var(--ink); }
button.amt { text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 5px; }
button.amt:hover { color: var(--apron); }
.iname { overflow-wrap: anywhere; }
.step { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 10px; padding: 13px 4px; border-bottom: 1px solid var(--line); font-size: 1.05rem; line-height: 1.6; }
.sn { font: 700 1.35rem/1.15 var(--display); color: var(--apron); }
.tick { cursor: pointer; border-radius: 6px; transition: opacity .15s ease; }
.tick:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.tick.done { opacity: .42; }
.tick.done .iname, .tick.done .stext, .tick.done .amt { text-decoration: line-through; }
.tchip { display: inline-flex; align-items: center; gap: 4px; margin: 0 1px; padding: 0 8px 0 6px; min-height: 28px; border-radius: 999px; border: 1.5px solid var(--apron); background: var(--apron-soft); color: var(--apron); font: 700 .92em/1 var(--sans); vertical-align: baseline; }
.tchip .ico { width: 16px; height: 16px; }
.tchip:hover { background: var(--apron); color: var(--apron-ink); }
.temp { padding: 0 6px; border-radius: 6px; background: color-mix(in srgb, var(--hot) 14%, transparent); color: var(--hot); font-weight: 800; white-space: nowrap; }
.videos { display: grid; gap: 14px; }
@media (min-width: 760px) { .videos { grid-template-columns: 1fr 1fr; } }
.vid { overflow: hidden; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.vid video { display: block; width: 100%; max-height: 72vh; background: #000; }
.vid figcaption { padding: 10px 14px; font-weight: 700; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
.pager .btn { white-space: normal; text-align: left; }
.havef { display: grid; grid-template-columns: 1fr 5.5rem auto; gap: 8px; }

/* ---------- cook mode ---------- */
.cook { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; background: var(--steel); color: var(--on-steel); padding: env(safe-area-inset-top, 0px) var(--gutter-r) env(safe-area-inset-bottom, 0px) var(--gutter-l); outline: none; }
.cook-top { display: flex; align-items: center; gap: 10px; min-height: 64px; }
.cook-title { flex: 1; min-width: 0; display: grid; }
.cook-title span { color: var(--steel-muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cook-title b { font: 700 1.3rem/1.1 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cook-progress { display: flex; gap: 3px; padding: 4px 0 8px; }
.cook-progress span { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .14); }
.cook-progress .past { background: var(--steel-muted); }
.cook-progress .now { background: var(--apron-on-steel); }
.cook-ings { max-height: 34vh; overflow: auto; margin-bottom: 8px; padding: 12px 14px; border-radius: 12px; background: var(--steel-2); }
.cook-ings .label { color: var(--steel-muted); margin-bottom: 6px; }
.cook-ings ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.cook-ings li { display: grid; grid-template-columns: 6rem 1fr; gap: 12px; }
.cook-ings li .mono { text-align: right; color: var(--apron-on-steel); }
.cook-step { flex: 1; display: grid; gap: 14px; align-content: center; max-width: 900px; width: 100%; margin: 0 auto; overflow: auto; padding: 8px 0; }
.cook-n { color: var(--apron-on-steel); font-size: .95rem; }
.cook-text { font: 500 clamp(1.5rem, 5.4vw, 2.6rem)/1.32 var(--sans); }
.cook-text .tchip { min-height: 1.4em; border-color: var(--apron-on-steel); background: transparent; color: var(--apron-on-steel); font-size: .8em; }
.cook-text .tchip:hover { background: var(--apron-on-steel); color: #1E1210; }
.cook-text .temp { color: #F1A77C; background: rgba(241, 167, 124, .14); }
.cook-nav { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: 12px 0 14px; }

/* ---------- timers ---------- */
.timers { position: fixed; z-index: 45; transition: transform .2s ease; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom, 0px)); max-width: min(360px, calc(100% - 24px)); }
@media (min-width: 900px) { .timers { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); } }
body.cooking .timers { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
body.toasting .timers { transform: translateY(-76px); }
.timers-in { display: grid; gap: 6px; padding: 8px; border-radius: 16px; background: var(--ink); color: var(--ground); box-shadow: 0 14px 34px -10px rgba(0, 0, 0, .55); }
.timer { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; border-radius: 10px; }
.timer-txt { flex: 1; min-width: 0; display: grid; line-height: 1.15; }
.timer-txt b { font-size: 1.35rem; }
.timer-txt span { font-size: .78rem; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer.paused .timer-txt b { opacity: .55; }
.timer.done { background: var(--urgent); color: #fff; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.25); } }
.tbtn { display: inline-grid; place-items: center; min-width: 40px; height: 40px; padding: 0 8px; border-radius: 9px; border: 1.5px solid color-mix(in srgb, var(--ground) 30%, transparent); background: transparent; color: inherit; font: 700 .85rem var(--mono); }
.tbtn .ico { width: 18px; height: 18px; }
.tbtn.solid { background: #fff; color: var(--urgent); border-color: #fff; font-family: var(--sans); padding: 0 14px; }
.timers-more { border: 0; background: none; color: inherit; opacity: .75; font-size: .8rem; font-weight: 700; padding: 2px; }

/* ---------- toast ---------- */
.toast { position: fixed; z-index: 60; left: 0; right: 0; margin-inline: auto; width: fit-content; bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px); padding: 12px 12px 12px 18px; border-radius: 12px; background: var(--ink); color: var(--ground); font-weight: 700; box-shadow: 0 10px 28px -8px rgba(0, 0, 0, .45); }
/* a message never blocks the buttons under it; only its Undo takes taps */
.toast { pointer-events: none; }
.toast-act { pointer-events: auto; }
body:not(.has-tabs) .toast { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.toast:not([hidden]) { animation: toastin .24s cubic-bezier(.2, 1.2, .4, 1); }
@keyframes toastin { from { opacity: 0; transform: translateY(18px) scale(.96); } }
.toast.bad { background: var(--urgent); color: var(--urgent-ink); }
.toast.good { background: var(--ready); color: var(--ready-ink); }
body.has-bar .toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.toast-act { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1.5px solid currentColor; background: transparent; color: inherit; font-weight: 800; }
@media (min-width: 900px) { .toast { bottom: 26px; } }
body.cooking .toast { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

/* ---------- sheets ---------- */
.sheet-back { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 10, 10, .5); animation: fadein .18s ease-out; }
.sheet { display: grid; grid-template-rows: auto 1fr; width: 100%; max-width: 560px; max-height: 88vh; max-height: 88dvh; border-radius: 20px 20px 0 0; background: var(--ground); color: var(--ink); box-shadow: 0 -10px 40px rgba(0, 0, 0, .3); animation: sheetup .28s cubic-bezier(.2, .9, .3, 1); }
.sheet-back.still, .sheet-back.still .sheet, .lightbox.still { animation: none; }
@keyframes fadein { from { opacity: 0; } }
@keyframes sheetup { from { transform: translateY(60px); opacity: .4; } }
.sheet.wide { max-width: 720px; }
.sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 20px 10px 6px 18px; touch-action: none; }
.grab { position: absolute; top: 8px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 3px; background: var(--line); }
@media (min-width: 700px) { .grab { display: none; } .sheet-head { padding-top: 14px; touch-action: auto; } }
.sheet-head h2 { font: 700 1.5rem/1.1 var(--display); }
.sheet-body { display: grid; gap: 14px; align-content: start; overflow: auto; padding: 4px 18px calc(22px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .sheet-back { align-items: center; } .sheet { border-radius: 20px; max-height: 84vh; } }

/* ---------- forms ---------- */
.form { display: grid; gap: 4px; }
.form > .rtitle { margin-bottom: 10px; }
.field { display: grid; gap: 6px; margin-bottom: 16px; min-width: 0; }
.field > label, .legend { font-weight: 800; font-size: .95rem; }
.input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.input:focus { border-color: var(--apron); outline: none; }
.input.big { font-size: 1.15rem; font-weight: 700; }
.input.strong { font-weight: 800; }
.input.small { min-height: 40px; padding: 6px 10px; font-size: .92rem; }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.55; }
select.input { appearance: auto; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.check { display: flex; gap: 10px; align-items: center; min-height: 48px; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-weight: 600; cursor: pointer; }
.check input { flex: none; width: 22px; height: 22px; accent-color: var(--apron); }
.check span { display: grid; min-width: 0; }
.check small { font-weight: 500; font-size: .76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.check.auto { background: var(--todo-soft); border-color: var(--todo); cursor: default; }
.check.wide { margin-top: 8px; }
.ing-edit { display: grid; gap: 8px; }
.irow { display: grid; grid-template-columns: 5.5rem 4.5rem minmax(0, 1fr) 42px; gap: 8px; margin-bottom: 8px; }
@media (max-width: 560px) { .irow { grid-template-columns: 1fr 1fr 42px; grid-template-areas: "q u x" "n n n"; margin-bottom: 14px; } .irow .q { grid-area: q; } .irow .u { grid-area: u; } .irow .n { grid-area: n; } .irow .x { grid-area: x; } }
.cedit { margin-bottom: 10px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.cedit.open { border-color: var(--muted); }
.cedit-head { display: flex; align-items: center; gap: 4px; padding: 6px; }
.cedit-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 8px; border: 0; background: transparent; font-weight: 800; text-align: left; }
.cedit-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cedit-body { padding: 14px; border-top: 1px solid var(--line); }
.media-edit { display: grid; gap: 10px; }
.media-edit img { width: 100%; max-width: 420px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; }
.vrow { display: grid; grid-template-columns: 1fr 42px; gap: 8px; align-items: center; padding: 8px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.vrow video { grid-column: 1 / -1; width: 100%; max-height: 220px; border-radius: 8px; background: #000; }
.danger-zone { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.scanbox { display: grid; gap: 10px; margin-bottom: 22px; padding: 16px; border-radius: var(--r); background: var(--steel); color: var(--on-steel); }
.scanbox .hint { color: var(--steel-muted); }
.scanbox .input { background: var(--steel-2); border-color: rgba(255, 255, 255, .15); color: var(--on-steel); }
.status { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.status .ico { width: 20px; height: 20px; color: var(--apron-on-steel); }
.xrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.xrow .icon-btn { border: 1.5px solid var(--line); }
.inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.synrow { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.synrow input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--apron); }
.synrow span { display: grid; gap: 4px; }
.synrow small { color: var(--muted); }
.sheet-body h3.label { margin-top: 6px; }

/* ---------- Today ---------- */
.stpick { display: grid; gap: 6px; justify-items: start; }
@media (min-width: 700px) { .stpick { justify-items: end; } }
.stpick-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.stpick-btns button { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1.5px solid rgba(242, 242, 238, .25); background: rgba(255, 255, 255, .04); color: var(--on-steel); font-weight: 800; }
.stpick-btns .ico { width: 22px; height: 22px; }
.stpick-btns button[aria-pressed="true"] { background: var(--on-steel); color: #1C1B1A; border-color: var(--on-steel); }
.stpick-btns .st-hot[aria-pressed="true"] .ico { color: #B8561F; }
.stpick-btns .st-cold[aria-pressed="true"] .ico { color: #2C6A98; }
.stpick-btns .st-pass[aria-pressed="true"] .ico { color: #7A6626; }
.form .stpick { justify-items: start; margin: 8px 0 18px; padding: 12px; border-radius: var(--r); background: var(--steel); }
.today { padding-block: 18px 32px; }
.today-grid { display: grid; gap: 22px; }
@media (min-width: 1000px) { .today-grid { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } }
.today-main, .today-side { display: grid; gap: 18px; min-width: 0; align-content: start; }
.brief { display: grid; gap: 14px; padding: 16px; }
.brief-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.brief-head h2 { font: 700 1.6rem/1 var(--display); }
.brief-sec { display: grid; gap: 8px; }
.urglist { display: grid; gap: 8px; }
.urgrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 10px 10px 14px; border-radius: 12px; background: var(--urgent); color: var(--urgent-ink); }
.urgname { display: grid; gap: 2px; min-width: 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.urgmeta { font-size: .82rem; opacity: .9; }
.urgrow .tnote { border-left-color: currentColor; color: inherit; }
.urgrow .pbtn.done { background: var(--urgent-ink); border-color: var(--urgent-ink); color: var(--urgent); }
.evmini { display: grid; gap: 6px; }
.evchip { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); border-left: 4px solid var(--apron); background: var(--surface-2); text-align: left; }
.evchip b { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--apron); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.codechip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: .88rem; }
.codechip.p { border-color: var(--ink); }
.codechip.br { background: var(--todo-soft); border-color: var(--todo); color: var(--todo-ink); }
.codechip.off { color: var(--muted); }
.codechip.other { color: var(--apron); border-color: var(--apron); }
.codechip.big { min-height: 50px; min-width: 60px; justify-content: center; font-size: 1rem; }
.codechip.on { box-shadow: 0 0 0 3px var(--apron); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; }
.progress { display: flex; align-items: center; gap: 16px; padding: 14px 16px; }
.progress.all { border-color: var(--ready); background: var(--ready-soft); }
.ring { position: relative; flex: none; width: 56px; height: 56px; }
.ring svg { display: block; }
.ring-n { position: absolute; inset: 0; display: grid; place-items: center; font-size: .72rem; font-weight: 700; }
.prog-txt { display: grid; gap: 2px; }
.prog-txt b { font: 700 1.35rem/1.1 var(--display); }
.block { display: grid; gap: 10px; min-width: 0; }
.block.card { padding: 16px; }
.block-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.block-title { display: flex; align-items: baseline; gap: 10px; font: 700 1.6rem/1.05 var(--display); }
.todos { display: grid; gap: 8px; }
.todo { position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); touch-action: pan-y; }
.todo > .sw-in { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 64px; padding: 8px 6px 8px 12px; background: var(--surface); box-shadow: inset 4px 0 0 var(--todo); }
.todo > .sw-in.no-check { grid-template-columns: minmax(0, 1fr) auto; padding-left: 16px; }
.todo.urgent { border-color: var(--urgent); }
.todo.urgent > .sw-in { box-shadow: inset 5px 0 0 var(--urgent); }
.todo.event > .sw-in { box-shadow: inset 4px 0 0 var(--apron); }
.todo.repeat > .sw-in { box-shadow: inset 5px 0 0 var(--urgent); }
.todo.sw-r .sw-bg { background: var(--ready); color: var(--ready-ink); }
.todo.sw-l .sw-bg { background: var(--urgent); color: var(--urgent-ink); }
.todo.sw-r .sw-ready, .todo.sw-l .sw-del { opacity: .65; }
.todo.sw-armed .sw-ready, .todo.sw-armed .sw-del { opacity: 1; transform: scale(1.15); }
.todo.dragging > .sw-in { box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .4); }
/* the tick: a big round target, fills green with a pop */
.tcheck { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ready); background: transparent; color: transparent; transition: background-color .12s ease, color .12s ease; }
.tcheck .ico { width: 22px; height: 22px; }
@media (hover: hover) { .tcheck:hover { color: color-mix(in srgb, var(--ready) 45%, transparent); } }
.tcheck.ticked { background: var(--ready); color: var(--ready-ink); animation: pop .36s cubic-bezier(.3, 1.6, .5, 1); }
.todo-hint { margin: -4px 0 2px; font-size: .84rem; }
.todo-main { display: grid; gap: 3px; min-width: 0; padding: 4px 0; border: 0; background: none; color: var(--ink); text-align: left; }
button.todo-main { cursor: pointer; }
.todo-name { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
.urgtag { margin-right: 6px; padding: 1px 6px; border-radius: 4px; background: var(--urgent); color: var(--urgent-ink); font: 800 .66rem/1.5 var(--sans); letter-spacing: .1em; text-transform: uppercase; vertical-align: 2px; }
.todo-meta { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); font-size: .84rem; }
.tnote { display: block; padding-left: 8px; border-left: 3px solid var(--apron); color: var(--ink); font-size: .9rem; font-style: italic; white-space: pre-wrap; }
.recipelink { display: inline-flex; align-items: center; gap: 2px; color: var(--apron); font-weight: 800; cursor: pointer; }
.recipelink .ico { width: 14px; height: 14px; }
.addnote { text-decoration: underline; text-underline-offset: 3px; }
.todo-acts { display: flex; gap: 6px; }
.pbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); font-weight: 800; font-size: .9rem; white-space: nowrap; }
.pbtn .ico { width: 18px; height: 18px; }
.pbtn.ghost { padding: 0; width: 44px; }
.pbtn.done { background: var(--ready); border-color: var(--ready); color: var(--ready-ink); }
.pbtn.flag { padding: 0; width: 44px; color: var(--urgent); font-size: 1.15rem; }
.pbtn.flag.on { background: var(--urgent); border-color: var(--urgent); color: var(--urgent-ink); }
.noteform { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; margin-top: 6px; }
.todo-wrap { display: grid; }
.addtask { display: grid; gap: 6px; justify-items: start; }
.addtask-row { display: grid; grid-template-columns: minmax(0, 1fr) 46px auto; gap: 8px; width: 100%; }
.addtask .input { width: 100%; }
.askorder { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-radius: var(--r); border: 0; background: var(--steel); color: var(--on-steel); text-align: left; }
.askorder > .ico { width: 26px; height: 26px; }
.ask-txt { flex: 1; display: grid; gap: 2px; }
.ask-txt b { font-size: 1.08rem; }
.ask-txt span { color: var(--steel-muted); font-size: .9rem; }
.askorder.sent { background: var(--ready-soft); color: var(--ink); border: 1px solid var(--ready); }
.askorder.sent .ask-txt span { color: var(--muted); }
.legend-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flagtxt { color: var(--urgent); font-size: 1.05rem; }
.mep { display: grid; gap: 18px; }
/* today / tomorrow switch above the list; tomorrow's prep list gets a calm blue-grey wash */
.daypick-row { flex-basis: 100%; }
.seg.daypick-seg { display: flex; width: 100%; }
.seg.daypick-seg button { flex: 1; min-height: 42px; padding: 0 8px; font-size: .9rem; white-space: nowrap; }
@media (max-width: 380px) { .seg.daypick-seg button { font-size: .82rem; padding: 0 4px; } }
.plan-note { flex-basis: 100%; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--cold) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--cold) 35%, var(--line)); font-size: .92rem; }
.mep.planning .mep-gname { background: color-mix(in srgb, var(--cold) 10%, var(--surface-2)); }
.gcount.tomake { color: var(--todo-ink); background: var(--todo-soft); padding: 1px 8px; border-radius: 999px; font-weight: 800; }
.mep-title { font: 700 .8rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.mep-groups { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); align-items: start; }
.mep-group { overflow: hidden; }
.mep-group.complete { border-color: var(--ready); }
.mep-gname { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.mep-gname b, .gname-link { flex: 1; min-width: 0; font: 700 1.15rem/1.1 var(--display); }
.gname-link { border: 0; background: none; padding: 4px 0; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.gname-link:hover { text-decoration-color: var(--apron); }
.gcount { font-size: .78rem; color: var(--muted); }
.mep-group.complete .gcount { color: var(--ready); font-weight: 800; }
.mep-add { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); color: var(--apron); }
.mep-add .ico { width: 18px; height: 18px; }
.mrow { position: relative; overflow: hidden; border-top: 1px solid var(--line); touch-action: pan-y; }
.mep-gname + .mrow { border-top: 0; }
.sw-in { position: relative; z-index: 1; display: grid; grid-template-columns: 50px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; min-height: 54px; padding: 4px 6px 4px 8px; background: var(--surface); }
.mrow.ok .mname { color: var(--muted); }
.mrow.urgent .sw-in { background: var(--urgent-soft); box-shadow: inset 4px 0 0 var(--urgent); }
.sw-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font: 800 .95rem/1 var(--sans); background: var(--surface-2); }
.sw-bg span { display: inline-flex; align-items: center; gap: 6px; opacity: 0; transform: scale(.85); transition: opacity .12s ease, transform .15s cubic-bezier(.3, 1.6, .5, 1); }
.sw-bg .ico { width: 22px; height: 22px; }
.mrow.sw-r .sw-bg { background: var(--ready); color: var(--ready-ink); }
.mrow.sw-l .sw-bg { background: var(--todo); color: var(--todo-ink); }
.mrow.sw-r .sw-ready, .mrow.sw-l .sw-do { opacity: .65; }
.mrow.sw-armed .sw-ready, .mrow.sw-armed .sw-do { opacity: 1; transform: scale(1.15); }
.mrow.dragging .sw-in { box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .4); }
.mbox { display: grid; place-items: center; width: 50px; height: 38px; border-radius: 8px; border: 2px dashed var(--line); background: transparent; color: var(--ink); font: 800 .82rem/1 var(--mono); letter-spacing: .04em; }
.mbox:hover { border-color: var(--muted); }
.mbox.do { border: 0; background: var(--todo); color: var(--todo-ink); clip-path: polygon(0 0, 100% 0, 94% 25%, 100% 50%, 94% 75%, 100% 100%, 0 100%, 6% 75%, 0 50%, 6% 25%); transform: rotate(-2deg); }
.mbox.ok { border: 0; background: var(--ready); color: var(--ready-ink); }
.mbox.ok .ico { width: 22px; height: 22px; }
.mbox.pop { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.55); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
.mbox.sample { display: inline-grid; width: 34px; height: 24px; vertical-align: middle; font-size: .62rem; cursor: default; }
.mbox.sample .ico { width: 15px; height: 15px; }
.mname { display: grid; gap: 2px; min-width: 0; font-size: .98rem; line-height: 1.25; }
.mlink { border: 0; background: none; padding: 0; text-align: left; color: inherit; text-decoration: underline; text-decoration-color: var(--apron); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.xtag { justify-self: start; padding: 0 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); font-size: .7rem; font-weight: 700; }
.mflag { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 1.5px solid transparent; background: transparent; color: var(--urgent); font-weight: 900; font-size: 1.1rem; opacity: .5; }
.mflag .ico { width: 16px; height: 16px; color: var(--muted); }
.mflag:hover { opacity: 1; border-color: var(--line); }
.mflag.on { opacity: 1; background: var(--urgent); color: var(--urgent-ink); }
.hint.pad { padding: 10px 14px; margin: 0; }
.addx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.finish { display: grid; gap: 8px; margin-top: 4px; }
.finish.done p { color: var(--muted); }
.tmr { border-style: dashed; border-color: var(--apron); }
.donebox summary { cursor: pointer; display: flex; align-items: baseline; gap: 10px; font: 700 1.3rem/1 var(--display); }
.donebox summary .n { font: 600 .8rem var(--mono); color: var(--muted); }
.donelist { display: grid; gap: 4px; margin-top: 8px; }
.doneitem { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; color: var(--muted); }
.doneitem .ico { color: var(--ready); width: 18px; height: 18px; }
.doneitem span { text-decoration: line-through; }
.stocklist { display: grid; }
.stock { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.stock .input.small { grid-column: 1 / -1; }
.stock.flag-red { padding: 10px; margin: 4px 0; border: 0; border-radius: 12px; background: var(--urgent-soft); box-shadow: inset 4px 0 0 var(--urgent); }
.stock.flag-ask { padding: 10px; margin: 4px 0; border: 0; border-radius: 12px; background: var(--todo-soft); }
.stock-acts { display: flex; gap: 4px; }
.sbtn { min-height: 42px; min-width: 50px; padding: 0 10px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; font-size: .86rem; }
.sbtn.ok[aria-pressed="true"] { background: var(--surface-2); border-color: var(--muted); }
.sbtn.low[aria-pressed="true"] { background: var(--todo); border-color: var(--todo); color: var(--todo-ink); }
.sbtn.out[aria-pressed="true"] { background: var(--urgent); border-color: var(--urgent); color: var(--urgent-ink); }
.unlinked { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.unlinked summary { cursor: pointer; font-weight: 700; font-size: .92rem; }
.lsec { display: grid; gap: 10px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
.lgroup { display: grid; gap: 8px; padding: 12px; }
.litem { display: grid; grid-template-columns: minmax(0, 1fr) 42px 42px 42px; gap: 6px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.litem .linksel { grid-column: 1 / -1; color: var(--muted); }
.linkwarn { grid-column: 1 / -1; color: var(--urgent); font-size: .82rem; font-weight: 700; }
.litem .icon-btn, .xrow .icon-btn { border: 1.5px solid var(--line); }

/* ---------- Orders ---------- */
.orders { padding-block: 18px 32px; }
.ostations { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
@media (max-width: 560px) { .ostations { grid-template-columns: 1fr; } }
.ost { display: grid; gap: 2px; padding: 12px 14px; box-shadow: none; border-style: dashed; }
.ost.in { border-style: solid; border-color: var(--ready); background: var(--ready-soft); }
.ost-name { display: flex; align-items: center; gap: 6px; font-weight: 800; }
.ost-name .ico { width: 18px; height: 18px; }
.ost .muted { font-size: .85rem; }
.orders-grid { display: grid; gap: 22px; }
@media (min-width: 1000px) { .orders-grid { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }
.olist { overflow: hidden; }
.oline { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 12px 14px; border-top: 1px solid var(--line); }
.oline:first-child { border-top: 0; }
.oline-txt { display: grid; gap: 2px; min-width: 0; }
.oline-txt .muted { font-size: .88rem; }
.obadge { min-width: 48px; padding: 3px 8px; border-radius: 6px; text-align: center; font: 800 .78rem/1.4 var(--mono); text-transform: uppercase; }
.oline.out .obadge { background: var(--urgent); color: var(--urgent-ink); }

.rota thead th.now { background: var(--apron); color: var(--apron-ink); }
.rota tbody th { padding: 0 8px; text-align: left; font-weight: 800; white-space: nowrap; max-width: 8rem; overflow: hidden; text-overflow: ellipsis; background: var(--surface-2); }

.rota td button, .rota .pname { display: block; width: 100%; border: 0; background: transparent; color: inherit; font: inherit; padding: 0; }
.rota .pname { padding: 11px 0; text-align: left; font-weight: 800; }

/* ---------- Events ---------- */

/* ---------- settings, branding, reports ---------- */
.settings { display: grid; gap: 10px; }
.set-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }

.set-link { display: grid; grid-template-columns: 24px 1fr 20px; gap: 12px; align-items: center; width: 100%; padding: 14px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.set-link > span { display: grid; gap: 2px; }
.set-link .muted { font-size: .86rem; }
.set-link .ico { width: 22px; height: 22px; }
.set-link.quiet { background: transparent; box-shadow: none; }
.set-link.quiet b { font-weight: 700; }
.rep { display: grid; gap: 8px; padding: 10px; margin-bottom: 8px; box-shadow: none; }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.pagephotos { display: grid; gap: 10px; }

.gal-edit { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; margin-bottom: 4px; }
.ge { display: grid; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }

/* ---------- quiet moments: the courtyard cat ---------- */
.rest { display: grid; justify-items: center; gap: 6px; margin-top: 14px; padding: 22px 18px 24px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: center; color: var(--muted); }
.rest-cat { width: 128px; height: 128px; margin-bottom: 6px; border-radius: 50%; object-fit: cover; object-position: center 60%; box-shadow: 0 0 0 4px var(--surface), 0 0 0 5px var(--line); }

/* ---------- photo galleries and the viewer ---------- */
.gallery { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(-1 * var(--gutter-r)) 14px calc(-1 * var(--gutter-l)); padding: 2px var(--gutter-r) 10px var(--gutter-l); scroll-padding-inline: var(--gutter-l); scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.gal-item { position: relative; flex: none; width: min(74vw, 320px); aspect-ratio: 4 / 5; padding: 0; border: 0; border-radius: 16px; overflow: hidden; background: var(--surface-2); scroll-snap-align: start; box-shadow: var(--shadow); cursor: zoom-in; }

.lightbox { position: fixed; inset: 0; z-index: 55; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; background: #0A0A0A; color: #fff; padding: env(safe-area-inset-top, 0px) var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); outline: none; animation: fadein .18s ease-out; }
.lb-top { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }

.lb-cap { padding: 10px 0 2px; text-align: center; font-weight: 700; }
.lb-nav { display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 6px; }
.lb-dots { display: flex; gap: 6px; }
.lb-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .3); transition: background-color .15s ease, transform .15s ease; }
.lb-dots span.on { background: #fff; transform: scale(1.25); }

/* ---------- Today: jump bar ---------- */
.tjump { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); z-index: 12; display: flex; gap: 6px; overflow-x: auto; margin: -18px calc(-1 * var(--gutter-r)) 16px calc(-1 * var(--gutter-l)); padding: 8px var(--gutter-r) 8px var(--gutter-l); background: var(--ground); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tjump::-webkit-scrollbar { display: none; }
.tjump button { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 800; font-size: .88rem; }

@media (min-width: 1000px) { .tjump { display: none; } }

/* ---------- the order check: a deck of product cards ---------- */
.deck-page { display: flex; flex-direction: column; min-height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); min-height: calc(100dvh - var(--top-h) - env(safe-area-inset-top, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
.deck-head { display: grid; gap: 8px; padding-top: 14px; max-width: 520px; }
.deck-q { font: 700 clamp(1.6rem, 6.4vw, 2.3rem)/1.02 var(--display); }
.deck-prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.deck-prog span { display: block; height: 100%; border-radius: 3px; background: var(--ready); transition: width .25s ease; }
.deck-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: .88rem; font-weight: 700; }
.deck { position: relative; flex: 1; width: 100%; max-width: 440px; min-height: 290px; max-height: 480px; margin: 16px auto 0; }
.pcard { position: absolute; top: 0; bottom: 28px; left: var(--gutter-l); right: var(--gutter-r); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 30px 22px; border-radius: 26px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 18px 40px -20px rgba(0, 0, 0, .5); text-align: center; touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .25s cubic-bezier(.2, 1.2, .4, 1); }

.pcard.d2 { transform: translateY(28px) scale(.9); opacity: .7; }
.pcard.front { cursor: grab; animation: rise .22s ease-out; }
.pcard.held { cursor: grabbing; box-shadow: 0 28px 54px -20px rgba(0, 0, 0, .6); }
.pcard.flag-red { border-color: var(--urgent); }
@keyframes rise { from { transform: translateY(14px) scale(.95); } }
.stamp { position: absolute; top: 22px; padding: 5px 12px; border: 3px solid currentColor; border-radius: 10px; font: 800 1.45rem/1 var(--display); letter-spacing: .08em; text-transform: uppercase; opacity: 0; pointer-events: none; }
.stamp.have { left: 18px; color: var(--ready); transform: rotate(-12deg); }
.stamp.out { right: 18px; color: var(--urgent); transform: rotate(12deg); }
.stamp.low { top: auto; bottom: 22px; left: 50%; color: var(--todo-ink); background: var(--todo); border-color: var(--todo); transform: translateX(-50%) rotate(-4deg); }
.pc-mono { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 50%; color: rgba(255, 255, 255, .94); font: 700 2.9rem/1 var(--display); text-transform: uppercase; }
.pc-name { font: 700 clamp(1.8rem, 7.6vw, 2.5rem)/1.04 var(--display); overflow-wrap: anywhere; text-wrap: balance; }
.pc-used { display: grid; gap: 2px; color: var(--muted); font-size: .92rem; max-width: 32ch; }

.deck-acts { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 10px 0 4px; }
.dbtn { display: grid; justify-items: center; gap: 6px; border: 0; background: none; padding: 0; color: var(--muted); font: 800 .82rem/1 var(--sans); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.dbtn > .ico { box-sizing: content-box; width: 30px; height: 30px; padding: 16px; border-radius: 50%; border: 2px solid currentColor; background: var(--surface); box-shadow: var(--shadow); transition: transform .12s ease; }

.deck-hint { padding: 4px var(--gutter-r) 0 var(--gutter-l); text-align: center; color: var(--muted); font-size: .84rem; }
@media (max-height: 640px) { .deck-hint { display: none; } .deck-q { font-size: 1.5rem; } .pc-mono { width: 64px; height: 64px; font-size: 2.1rem; } }

/* ---------- the order summary ---------- */
.sum-head { display: grid; justify-items: center; gap: 8px; padding: 6px 0 18px; text-align: center; }
.sum-badge { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: var(--ready); color: var(--ready-ink); animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }

(function () {
  'use strict';

  /* ---------- DOM ---------- */
  /* h('button', {class:'btn', onclick: fn}, 'Label', child, [more]) */
  K.h = function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (k === 'checked') el.checked = !!v;
        else if (k === 'selected') el.selected = !!v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    append(el, Array.prototype.slice.call(arguments, 2));
    return el;
  };
  function append(el, kids) {
    for (const c of kids) {
      if (c == null || c === false) continue;
      if (Array.isArray(c)) append(el, c);
      else el.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
  }
  const h = K.h;

  K.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  K.clone = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));
  K.safeId = (s) => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, '-');
  K.store = {
    get(k, d) { try { const v = localStorage.getItem('komat.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('komat.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
  };

  const DAY = 86400000;
  K.ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  K.parseYmd = (s) => { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
  K.addDays = (d, n) => { const x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; };
  K.kitchenNow = () => new Date(Date.now() - 4 * 3600 * 1000);
  /* K.day(0) = today's kitchen date, K.day(-1) = yesterday, K.day(1) = tomorrow */
  K.day = (n) => K.ymd(K.addDays(K.kitchenNow(), n || 0));
  K.daysUntil = (ds) => Math.round((K.parseYmd(ds) - K.parseYmd(K.day(0))) / DAY);
  K.mondayOf = (d) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };

  K.kitchenMinutes = () => { const n = new Date(); const m = n.getHours() * 60 + n.getMinutes(); return m < 240 ? m + 1440 : m; };

  K.DAY_DOTS = ['#2F6FD0', '#E8C02E', '#D23B2F', '#7A4B2A', '#2E9150', '#EE8A22', '#1B1B1B'];

  K.fmtNum = (n) => {
    n = +n;
    const s = n >= 100 ? Math.round(n) : n >= 10 ? Math.round(n * 10) / 10 : Math.round(n * 100) / 100;
    return String(s);
  };

    s = String(s == null ? '' : s).trim().replace(',', '.');

  const LAT_A = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch', ш: 'sh', щ: 'sht', ъ: 'a', ь: 'y', ю: 'yu', я: 'ya' };

  crustaceans:['shrimp','prawn','crab','lobster','langoustine','crayfish','scampi','krill','скарид','рак!','раци!','омар','лангуст','лангустин'],
  eggs:['egg','yolk','albumen','mayonnaise','mayo!','aioli','meringue','hollandaise','béarnaise','bearnaise','custard','яйц','яйчн','жълтък','жълтъц','белтък','белтъц','майонез','айоли','меринг'],
  fish:['fish','salmon','tuna','cod!','sea bass','seabass','bass!','trout','anchov','sardin','mackerel','halibut','turbot','bream','hake','pike!','carp!','sole!','plaice','monkfish','snapper','mullet','bonito','katsuobushi','dashi','caviar','roe!','ikura','tobiko','katsuobushi','кацубуши','гарум','worcestershire','colatura','garum','риба','рибен','рибн','сьомга','пъстърв','лаврак','ципура','аншоа','сардин','скумри','тон!','риба тон','треска','калкан','шаран','щука','хайвер','хек','барбун','паламуд','чернокоп'],

  nuts:['almond','hazelnut','walnut','cashew','pecan','pistachio','macadamia','brazil nut','pine nut','praline','marzipan','frangipane','gianduja','nutella','orgeat','бадем','лешни','орех','орехи','кашу','пекан','шам фъстък','шамфъстък','макадами','пралин','марципан'],
  celery:['celery','celeriac','целин'],
  mustard:['mustard','dijon','дижон','горчиц'],
  sesame:['sesame','tahini','tahina','gomasio','furikake','togarashi','тогараши','сусам','тахан','тахини'],

  molluscs:['mussel','oyster','clam','scallop','squid','octopus','cuttlefish','calamari','snail','escargot','whelk','cockle','abalone','миди','мида','стрид','калмар','октопод','сепия','охлюв','морски дар']
};

  const ALSO = {'шам фъстък':['nuts'],'шамфъстък':['nuts'],'сирене кашу':['nuts'],'soy sauce':['gluten'],'соев сос':['gluten'],'pesto':['nuts','milk'],'песто':['nuts','milk'],'almond milk':['nuts'],'бадемово мляко':['nuts'],'almond flour':['nuts'],'peanut butter':['peanuts'],'soy milk':['soy'],'mayonnaise':['eggs','mustard'],'холандез':['eggs','milk'],'бешамел':['gluten','milk'],'мляко кашу':['nuts'],'aioli':['eggs'],'caesar':['eggs','fish','milk'],'worcestershire':['fish'],'hollandaise':['eggs','milk'],'béarnaise':['eggs','milk'],'bearnaise':['eggs','milk'],'praline':['nuts'],'nougat':['nuts','eggs'],'brioche':['eggs','milk'],'croissant':['milk'],'custard':['eggs','milk'],'ice cream':['milk','eggs']};

  const SKIP = ['редукция холандез', 'hollandaise reduction'];

  };

  K.detectAllergens = function (lists) {
    const found = {};

  };

})();

<script>
/* js/store.js */
/* Storage: one API for both ways the book runs.
   - Shared: inside Claude, the artifact's live database (everyone sees changes at once).
   - This device: the stand-alone site keeps a local copy in the browser (localStorage for
     records, IndexedDB for photos). It mimics the parts of the database API the app uses. */
(function () {
  'use strict';
  const K = window.K;

  /* ---------- local database ---------- */
  const DB_KEY = 'komat.db.v1';
  function freeze(o) { if (o && typeof o === 'object' && !Object.isFrozen(o)) { Object.values(o).forEach(freeze); Object.freeze(o); } return o; }
  function parentOf(path) { const i = path.lastIndexOf('/'); return i < 0 ? '' : path.slice(0, i); }
  function snap(path, data) {
    const id = path.slice(path.lastIndexOf('/') + 1);
    return { id: id, exists: data !== undefined, data: () => (data === undefined ? undefined : freeze(K.clone(data))), metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function merge(into, patch) {
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && into[k] && typeof into[k] === 'object' && !Array.isArray(into[k])) merge(into[k], v);
      else into[k] = K.clone(v);
    }
    return into;
  }
  function test(doc, w) {
    const v = doc[w[0]], x = w[2];
    switch (w[1]) {
      case '==': return v === x;
      case '!=': return v !== x;
      case '<': return v < x;
      case '<=': return v <= x;
      case '>': return v > x;
      case '>=': return v >= x;
      case 'in': return Array.isArray(x) && x.includes(v);
      case 'not-in': return Array.isArray(x) && !x.includes(v);
      case 'array-contains': return Array.isArray(v) && v.includes(x);
      default: return false;
    }
  }
  const err = (code, message) => ({ code: code, message: message || code });

  function LocalDB(seed) {
    this.subs = new Set();
    this.docs = this.load();
    if (!this.docs) { this.docs = {}; if (seed) seed(this.docs); this.save(); }

      if (e.key !== DB_KEY) return;
      this.docs = this.load() || {};

    });
