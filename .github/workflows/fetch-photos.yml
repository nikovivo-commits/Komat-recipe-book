# One-off: GitHub's machines download the generated photos into the repo.
name: Fetch generated photos
on:
  push:
    branches: [claude/cookbook-html-recreation-vgn40u]
    paths: [tools/photo-sources.json, tools/fetch_photos.py, .github/workflows/fetch-photos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==10.4.0
      - run: python3 tools/fetch_photos.py
      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/produce assets/photos/art
          git diff --cached --quiet || git commit -m "Add generated product photos and recipe illustrations"
          git push
