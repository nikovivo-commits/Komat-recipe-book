<script>
/* works offline once opened; a new version takes over on the next return to the app */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('floor/sw.js', { scope: 'floor/', updateViaCache: 'none' }).then(function (r) {
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') r.update().catch(function () {}); });
  }).catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadSW) { hadSW = true; return; }
    var go = function () { var a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { setTimeout(go, 3000); return; } location.reload(); };
    go();
  });
}
</script>
